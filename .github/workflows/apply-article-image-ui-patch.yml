name: Apply article image UI patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch article image rendering and README
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('src/components/BlogHub.tsx')
          s = p.read_text(encoding='utf-8')

          if 'const [articleImageError, setArticleImageError]' not in s:
              s = s.replace(
                  "  const [copiedLink, setCopiedLink] = useState(false);",
                  "  const [copiedLink, setCopiedLink] = useState(false);\n  const [articleImageError, setArticleImageError] = useState(false);"
              )

          if 'setArticleImageError(false)' not in s:
              s = s.replace(
                  "  useEffect(() => {\n    if (!readingArticle) return;",
                  "  useEffect(() => {\n    setArticleImageError(false);\n  }, [readingArticle?.id, readingArticle?.coverImage]);\n\n  useEffect(() => {\n    if (!readingArticle) return;"
              )

          start_marker = '            <div className="lg:col-span-7 relative h-64 lg:h-auto overflow-hidden bg-slate-900">'
          end_marker = '            <div className="lg:col-span-5 p-6 sm:p-8 flex flex-col justify-between space-y-4">'
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Featured image block markers not found')

          new_image_block = '''            {featuredArticle.coverImage && (\n              <div className="lg:col-span-7 relative h-64 lg:h-auto overflow-hidden bg-slate-900">\n                <img\n                  src={featuredArticle.coverImage}\n                  alt={featuredArticle.title}\n                  loading="lazy"\n                  decoding="async"\n                  className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"\n                  onError={event => { event.currentTarget.hidden = true; }}\n                />\n                <div className="absolute top-4 right-4 px-3 py-1 rounded-full bg-sky-500 text-white text-xs font-bold shadow-md">مقاله ویژه پلتفرم</div>\n                {featuredArticle.videoUrl && (\n                  <div className="absolute bottom-4 right-4 px-2.5 py-1 rounded-lg bg-black/80 text-emerald-400 text-[11px] font-semibold flex items-center gap-1.5 backdrop-blur-md">\n                    <Video className="w-3.5 h-3.5" />\n                    <span>شامل ویدیو آموزشی</span>\n                  </div>\n                )}\n              </div>\n            )}\n\n'''
          s = s[:start] + new_image_block + s[end:]

          old = '            <div className="lg:col-span-5 p-6 sm:p-8 flex flex-col justify-between space-y-4">'
          new = '            <div className={`p-6 sm:p-8 flex flex-col justify-between space-y-4 ${featuredArticle.coverImage ? \'lg:col-span-5\' : \'lg:col-span-12\'}`}>'
          if old not in s:
              raise SystemExit('Featured content column marker not found')
          s = s.replace(old, new, 1)

          old_reader = '''            {readingArticle.coverImage && (\n              <figure className="rounded-2xl overflow-hidden border border-slate-800 bg-slate-950">\n                <img\n                  src={readingArticle.coverImage}\n                  alt={readingArticle.title}\n                  className="w-full max-h-[52vh] sm:max-h-[30rem] object-cover"\n                />\n              </figure>\n            )}'''
          new_reader = '''            {readingArticle.coverImage && !articleImageError && (\n              <figure className="rounded-2xl overflow-hidden border border-slate-800 bg-slate-950">\n                <img\n                  src={readingArticle.coverImage}\n                  alt={readingArticle.title}\n                  loading="eager"\n                  decoding="async"\n                  className="w-full max-h-[52vh] sm:max-h-[30rem] object-cover"\n                  onError={() => setArticleImageError(true)}\n                />\n              </figure>\n            )}'''
          if old_reader not in s:
              raise SystemExit('Reader image block not found')
          s = s.replace(old_reader, new_reader, 1)

          p.write_text(s, encoding='utf-8')

          r = Path('README.md')
          readme = r.read_text(encoding='utf-8')
          marker = '## Article Data Flow\n'
          note = '''## Article Image Rendering Policy\n\nArticle presentation intentionally distinguishes between articles with a valid cover image and articles without one. A missing cover image must not create an empty image container, decorative placeholder, or reserved image area in the article reader or featured article layout.\n\nThe article UI also handles an image that fails to load as an unavailable image and removes it from the reader presentation instead of displaying a broken image. Valid images use explicit loading/decoding behavior and descriptive `alt` text.\n\nThis policy keeps the article layout clean, avoids misleading visual placeholders, and prevents image-related UI failures from degrading the reading experience or article content.\n\n'''
          if '## Article Image Rendering Policy' not in readme:
              if marker not in readme:
                  raise SystemExit('README insertion marker not found')
              readme = readme.replace(marker, note + marker, 1)
              r.write_text(readme, encoding='utf-8')
          PY

      - name: Typecheck and tests
        run: |
          npm ci
          npm run lint
          npm test

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/BlogHub.tsx README.md
          git diff --cached --quiet && exit 0
          git commit -m 'fix: render article images conditionally'
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/apply-article-image-ui-patch.yml
          git add .github/workflows/apply-article-image-ui-patch.yml
          git commit -m 'chore: remove temporary article image patch workflow' || true
          git push || true
