name: Pay lock root fix

on:
  push:
    branches: [feat/pay-payment-link-hosted-checkout]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Repair workspace dependency root
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('bun.lock')
          s = p.read_text()
          if '"express": "^4.21.2"' not in s.split('"packages":', 1)[0]:
              s = s.replace('        "esbuild": "0.28.2",\n', '        "esbuild": "0.28.2",\n        "express": "^4.21.2",\n', 1)
          if '"tsx": "^4.20.6"' not in s.split('"packages":', 1)[0]:
              s = s.replace('        "tailwindcss": "^4.3.3",\n', '        "tailwindcss": "^4.3.3",\n        "tsx": "^4.20.6",\n', 1)
          p.write_text(s)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock
          git diff --cached --quiet || git commit -m 'fix(pay): synchronize lockfile workspace dependencies'
          git push
