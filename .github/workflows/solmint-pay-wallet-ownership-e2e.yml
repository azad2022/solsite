name: SolMint Pay Wallet Ownership E2E

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'e2e/pay-wallet-ownership-lifecycle.e2e.ts'
      - 'functions/api/pay/v1/merchants/**/wallet-challenges.ts'
      - 'functions/api/pay/v1/merchants/**/wallet-challenges/**.ts'
      - '.github/workflows/solmint-pay-wallet-ownership-e2e.yml'
      - 'package.json'
      - 'bun.lockb'
  workflow_dispatch:
    inputs:
      test_ref:
        description: Ref containing the Wallet Ownership E2E implementation
        required: true
        default: test/pay-wallet-ownership-e2e-on-114
        type: string
  push:
    branches:
      - test/pay-wallet-ownership-e2e-on-114

permissions:
  contents: read

concurrency:
  group: pay-wallet-ownership-e2e
  cancel-in-progress: false

env:
  SOLMINT_PAY_PRODUCTION_ORIGIN: https://solmint.ir

jobs:
  wallet-ownership-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAY_E2E_OTHER_MERCHANT_ID: ${{ secrets.PAY_E2E_OTHER_MERCHANT_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout selected test ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.test_ref || github.event.pull_request.head.sha || github.ref_name }}
          persist-credentials: false

      - name: Verify selected test ref contains Wallet Ownership E2E
        shell: bash
        run: |
          set -euo pipefail
          test -f 'e2e/pay-wallet-ownership-lifecycle.e2e.ts'
          test -f 'functions/api/pay/v1/merchants/[merchantId]/wallet-challenges.ts'
          test -f 'functions/api/pay/v1/merchants/[merchantId]/wallet-challenges/[challengeId].ts'
          printf 'Testing ref: %s\n' '${{ inputs.test_ref || github.event.pull_request.head.sha || github.ref_name }}'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies (immutable)
        run: bun install --frozen-lockfile

      - name: Require existing controlled Wallet E2E configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PAY_E2E_OTHER_MERCHANT_ID"
          test -n "$SUPABASE_DB_URL"
          test -n "$SUPABASE_DB_PASSWORD"

      - name: Run authenticated wallet ownership lifecycle E2E
        run: bunx tsx e2e/pay-wallet-ownership-lifecycle.e2e.ts

      - name: Assert source tree is unchanged by E2E
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"