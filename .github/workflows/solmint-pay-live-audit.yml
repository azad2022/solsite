name: SolMint Pay — Live Browser Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/solmint-pay-live-audit.yml'
      - '.github/solmint-pay-live-audit.trigger'
      - 'e2e/pay-production-ui.e2e.mjs'
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  live-audit:
    if: contains(github.event.head_commit.message, 'live browser audit') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOLMINT_PAY_PRODUCTION_ORIGIN: https://solmint.ir
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Playwright
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for Cloudflare Pages deployment of this commit
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.GITHUB_TOKEN;
          const repository = process.env.GITHUB_REPOSITORY;
          const sha = process.env.GITHUB_SHA;
          let last = '';
          for (let attempt = 1; attempt <= 60; attempt += 1) {
            const response = await fetch(
              'https://api.github.com/repos/' + repository + '/commits/' + sha + '/check-runs?per_page=100',
              { headers: { authorization: 'Bearer ' + token, accept: 'application/vnd.github+json' } },
            );
            if (!response.ok) throw new Error('GitHub check-runs lookup failed: ' + response.status);
            const data = await response.json();
            const check = (data.check_runs || []).find((item) => item.name === 'Cloudflare Pages');
            last = check ? 'status=' + check.status + ' conclusion=' + check.conclusion : 'Cloudflare Pages check not visible yet';
            console.log('PAGES_DEPLOY_WAIT attempt=' + attempt + ' ' + last);
            if (check?.status === 'completed' && check.conclusion === 'success') break;
            if (check?.status === 'completed' && check.conclusion !== 'success') {
              throw new Error('Cloudflare Pages deployment failed: ' + check.conclusion);
            }
            if (attempt === 60) throw new Error('Cloudflare Pages deployment did not complete. Last: ' + last);
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          NODE
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Live browser audit
        run: node e2e/pay-production-ui.e2e.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solmint-pay-live-browser-audit
          path: /tmp/pay-ui-evidence
          if-no-files-found: warn
