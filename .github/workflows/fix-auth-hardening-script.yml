name: Fix auth hardening script syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-script:
    if: ${{ !contains(github.event.head_commit.message, '[auth-script-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair nested template literals
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'scripts/harden-admin-frontend-auth.mjs';
          let s = fs.readFileSync(p, 'utf8');
          s = s.replaceAll('setUserManagementNotice(`', 'setUserManagementNotice(\\`');
          s = s.replaceAll('سرور به‌روزرسانی شد.`);', 'سرور به‌روزرسانی شد.\\`);');
          s = s.replaceAll('دیتابیس سرور اضافه شد.`);', 'دیتابیس سرور اضافه شد.\\`);');
          fs.writeFileSync(p, s);
          NODE
          node --check scripts/harden-admin-frontend-auth.mjs
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No syntax repair needed."
            exit 0
          fi
          git add scripts/harden-admin-frontend-auth.mjs
          git commit -m "fix: repair auth hardening script syntax [auth-script-fix]"
          git push
