name: Auth Source Hardening

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-auth-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify authentication hardening source
        run: |
          node --check scripts/harden-admin-frontend-v2.mjs
          node --check scripts/final-auth-cleanup.mjs
          node --check scripts/harden-server-auth-v2.mjs
          ! grep -R -n -E "hashPasscode\(|DEFAULT_PASSCODE_HASH|solmint_admin_passcode|solmint_admin_pass_hash|solmint_admin_session|solmint_current_user|passwordHash: passHash|passwordHash: activeHash" src/components/AdminCmsModal.tsx src/App.tsx server.ts
