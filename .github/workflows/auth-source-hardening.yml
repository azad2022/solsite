name: Auth Source Hardening

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-auth-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify authentication hardening source
        run: |
          node --check scripts/harden-admin-frontend-v2.mjs
          node --check scripts/final-auth-cleanup.mjs
          node --check scripts/harden-server-auth-v2.mjs
          node <<'NODE'
          const fs = require('node:fs');
          const files = ['src/components/AdminCmsModal.tsx', 'src/App.tsx', 'server.ts'];
          const forbidden = [
            'hashPasscode(',
            'DEFAULT_PASSCODE_HASH',
            'solmint_admin_passcode',
            'solmint_admin_pass_hash',
            'solmint_admin_session',
            'solmint_current_user',
            'passwordHash: passHash',
            'passwordHash: activeHash'
          ];
          const hits = [];
          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8');
            for (const token of forbidden) if (source.includes(token)) hits.push(`${file}: ${token}`);
          }
          if (hits.length) {
            console.error('Authentication hardening violations:\n' + hits.join('\n'));
            process.exit(1);
          }
          console.log('Authentication hardening source verification passed.');
          NODE
