name: Auth Source Hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden-auth-source:
    if: ${{ !contains(github.event.head_commit.message, '[auth-hardening]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply authentication hardening
        run: |
          node scripts/harden-admin-frontend-v2.mjs
          node scripts/final-auth-cleanup.mjs
          node scripts/harden-server-auth-v2.mjs

      - name: Commit hardened source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Authentication source already hardened."
            exit 0
          fi
          git add server.ts src/components/AdminCmsModal.tsx
          git commit -m "security: harden authentication source [auth-hardening]"
          git push
