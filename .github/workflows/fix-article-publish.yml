name: Apply verified article publish fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: startsWith(github.event.head_commit.message, 'chore: apply verified article publish fix')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch server database write path
        shell: python
        run: |
          from pathlib import Path
          p = Path('server.ts')
          s = p.read_text(encoding='utf-8')

          old = '''const SUPABASE_ANON_KEY = process.env.VITE_SUPABASE_ANON_KEY || process.env.SUPABASE_ANON_KEY || "sb_publishable_XaeRMCeIhR7-Zwq6YhdkVw_cOwO9OLt";'''
          new = '''const SUPABASE_SERVICE_ROLE_KEY = process.env.SUPABASE_SERVICE_ROLE_KEY || process.env.SUPABASE_SECRET_KEY || "";
const SUPABASE_ANON_KEY = SUPABASE_SERVICE_ROLE_KEY || process.env.VITE_SUPABASE_ANON_KEY || process.env.SUPABASE_ANON_KEY || "sb_publishable_XaeRMCeIhR7-Zwq6YhdkVw_cOwO9OLt";'''
          assert old in s, 'Supabase key initialization pattern not found'
          s = s.replace(old, new, 1)

          old = '''  app.post("/api/articles", async (req, res) => {'''
          new = '''  app.post("/api/articles", requireAdminAuth, async (req, res) => {'''
          assert old in s, 'Article POST route not found'
          s = s.replace(old, new, 1)

          old = '''            is_draft: article.isDraft ? 1 : 0'''
          new = '''            is_draft: Boolean(article.isDraft)'''
          assert old in s, 'Boolean is_draft conversion pattern not found'
          s = s.replace(old, new, 1)

          old = '''  app.delete("/api/articles/:id", async (req, res) => {'''
          new = '''  app.delete("/api/articles/:id", requireAdminAuth, async (req, res) => {'''
          assert old in s, 'Article DELETE route not found'
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Verify patch
        run: |
          grep -n 'SUPABASE_SERVICE_ROLE_KEY' server.ts
          grep -n 'app.post("/api/articles", requireAdminAuth' server.ts
          grep -n 'is_draft: Boolean(article.isDraft)' server.ts
          grep -n 'app.delete("/api/articles/:id", requireAdminAuth' server.ts

      - name: Commit final fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git rm .github/workflows/fix-article-publish.yml
          git commit -m "fix: repair manual article publication database write"
          git push origin HEAD:main
