name: Harden admin frontend authentication

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify hardened frontend source
        run: |
          node --check scripts/harden-admin-frontend-auth.mjs
          node --check scripts/harden-admin-frontend-v2.mjs
          ! grep -R -n -E "hashPasscode\(|DEFAULT_PASSCODE_HASH|solmint_admin_passcode|solmint_admin_pass_hash|solmint_admin_session|solmint_current_user|passwordHash: passHash|passwordHash: activeHash" src/components/AdminCmsModal.tsx src/App.tsx
