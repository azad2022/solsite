name: SolMint Pay Database Security

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/solmint-pay-database-security.yml"
  push:
    branches:
      - feat/solmint-pay-main-sync
    paths:
      - "supabase/**"
      - ".github/workflows/solmint-pay-database-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start isolated local Supabase
        run: supabase db start

      - name: Run database security tests
        run: supabase test db

      - name: Verify migration replayability
        run: supabase db reset --local

      - name: Re-run database security tests after reset
        run: supabase test db
