name: SolMint Pay Database Security

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/solmint-pay-database-security.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/solmint-pay-database-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: solmint_pay_security
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d solmint_pay_security"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run Pay identity/RLS security checks
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: solmint_pay_security
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/pay_identity_rls_security.sql

      - name: Run Pay API-key lifecycle security checks
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: solmint_pay_security
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/pay_api_key_lifecycle_security.sql
