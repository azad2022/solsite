name: SolMint Pay Subscription SDK Compatibility Spike

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/subscription-sdk-compat/**'
      - '.github/workflows/solmint-pay-subscription-sdk-compat.yml'
  push:
    branches: [feat/pay-subscription-billing]
    paths:
      - 'tools/subscription-sdk-compat/**'
      - '.github/workflows/solmint-pay-subscription-sdk-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: subscription-sdk-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-compat:
    name: SDK / web3.js / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    defaults:
      run:
        working-directory: tools/subscription-sdk-compat
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Record runtime and package-manager policy
        run: |
          node --version
          npm --version
          npm config set engine-strict false
          npm config get engine-strict

      - name: Resolve isolated lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install the exact isolated dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Report installed direct package versions
        run: npm ls --depth=0

      - name: Execute SDK / PDA / web3.js transaction compatibility tests
        run: npm test

      - name: Bundle using the Workerd export condition
        run: npm run build:workerd

      - name: Upload reproducibility and bundle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solmint-subscription-sdk-compat-node-${{ matrix.node-version }}
          path: |
            tools/subscription-sdk-compat/package-lock.json
            /tmp/solmint-subscription-sdk-workerd.mjs
          if-no-files-found: warn
          retention-days: 14
