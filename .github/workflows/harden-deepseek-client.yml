name: Harden DeepSeek client path

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'azad2022'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Remove browser-side DeepSeek direct fallback
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/utils/deepseekService.ts')
          text = p.read_text(encoding='utf-8')

          old = '''  // 2. Direct fetch fallback
  const endpoint = buildDeepSeekEndpoint(baseUrl);

  try {
    const response = await fetch(endpoint, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey.trim()}`
      },
      body: JSON.stringify({
        model: model || 'deepseek-chat',
        messages: [
          { role: 'user', content: 'سلام، تست ارتباط با API' }
        ],
        max_tokens: 10
      })
    });

    if (response.ok) {
      return {
        success: true,
        message: 'ارتباط مستقیم با API با موفقیت برقرار شد!'
      };
    } else {
      const errJson = await response.json().catch(() => ({}));
      let errMsg = errJson?.error?.message || errJson?.message || response.statusText;
      if (response.status === 401 || errMsg.toLowerCase().includes('authentication') || errMsg.toLowerCase().includes('api key') || errMsg.toLowerCase().includes('invalid')) {
        errMsg = 'کلید API دیپ‌سیک وارد شده نامعتبر یا منقضی می‌باشد.';
      } else if (response.status === 402 || errMsg.toLowerCase().includes('balance') || errMsg.toLowerCase().includes('insufficient')) {
        errMsg = 'اعتبار (Balance) حساب دیپ‌سیک شما کافی نیست یا تمام شده است.';
      } else if (response.status === 405) {
        errMsg = 'روش درخواست نامعتبر (کد 405). آدرس سرور به صورت https://api.deepseek.com/v1 تنظیم گردید.';
      }
      return {
        success: false,
        message: `خطا در اتصال به دیپ‌سیک (کد ${response.status}): ${errMsg}`
      };
    }
  } catch (err: any) {
    return {
      success: false,
      message: `خطای شبکه یا CORS در اتصال: ${err?.message || 'پاسخی دریافت نشد'}`
    };
  }
}'''

          new = '''  // Browser clients must never call the provider directly with an API key.
  // If the authenticated server proxy is unavailable, fail closed rather than
  // exposing the credential through a direct provider request.
  return {
    success: false,
    message: 'اتصال امن به سرویس پاسخگویی از طریق سرور در دسترس نیست. لطفاً دوباره تلاش کنید.'
  };
}'''

          if old not in text:
              raise SystemExit('Expected direct DeepSeek test fallback was not found; refusing to patch.')
          text = text.replace(old, new, 1)

          old_generate = '''      // 2. Direct fetch fallback if proxy did not return data
      if (!data) {
        const endpoint = buildDeepSeekEndpoint(settings.apiBaseUrl);
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${settings.apiKey.trim()}`
          },
          body: JSON.stringify({
            model: settings.model || 'deepseek-chat',
            messages: [
              { role: 'system', content: settings.systemPrompt },
              { role: 'user', content: userPrompt }
            ],
            temperature: 0.7
          })
        });
        if (res.ok) {
          data = await res.json();
        }
      }

      if (data) {'''

          new_generate = '''      // Never fall back to a provider request from the browser. The API key must
      // remain server-side even if the proxy is temporarily unavailable.
      if (data) {'''

          if old_generate not in text:
              raise SystemExit('Expected direct DeepSeek article fallback was not found; refusing to patch.')
          text = text.replace(old_generate, new_generate, 1)

          p.write_text(text, encoding='utf-8')

      - name: Validate
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm test
          npm run build

      - name: Remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/utils/deepseekService.ts .github/workflows/harden-deepseek-client.yml
          git commit -m 'security: remove browser-side DeepSeek API fallback'
          git push origin main
