name: SolMint Pay Production Browser UI E2E

on:
  push:
    branches: [main]
    paths:
      - 'e2e/pay-production-ui.e2e.mjs'
      - 'e2e/pay-referral-production.e2e.mjs'
      - 'src/pay/**'
      - 'src/main.tsx'
      - 'src/App.tsx'
      - 'src/utils/seoManager.ts'
      - 'functions/api/pay/**'
      - 'functions/r/**'
      - 'public/_routes.json'
      - 'supabase/migrations/*solmint_pay_referral*.sql'
      - 'functions/api/auth/**'
      - 'functions/_middleware.ts'
      - 'public/_headers'
      - 'index.html'
      - 'wrangler.toml'
      - 'package.json'
      - 'scripts/ensure-pages-routes.mjs'
      - '.github/workflows/solmint-pay-production-browser-ui.yml'
      - '.github/solmint-pay-production-ui-e2e.trigger'
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  browser-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOLMINT_PAY_PRODUCTION_ORIGIN: https://solmint.ir
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install project dependencies
        run: bun install --frozen-lockfile

      - name: Install isolated Playwright runner
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/pay-playwright"
          mkdir -p "$install_dir"
          npm install --prefix "$install_dir" --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          mkdir -p node_modules
          ln -s "$install_dir/node_modules/playwright" node_modules/playwright

      - name: Install Chromium
        run: "$RUNNER_TEMP/pay-playwright/node_modules/.bin/playwright" install --with-deps chromium

      - name: Wait for Cloudflare Pages deployment of this commit
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.GITHUB_TOKEN;
          const repository = process.env.GITHUB_REPOSITORY;
          const sha = process.env.GITHUB_SHA;
          let last = '';
          for (let attempt = 1; attempt <= 180; attempt += 1) {
            const response = await fetch(
              'https://api.github.com/repos/' + repository + '/commits/' + sha + '/check-runs?per_page=100',
              { headers: { authorization: 'Bearer ' + token, accept: 'application/vnd.github+json' } },
            );
            if (!response.ok) throw new Error('GitHub check-runs lookup failed: ' + response.status);
            const data = await response.json();
            const check = (data.check_runs || []).find((item) => item.name === 'Cloudflare Pages');
            last = check ? 'status=' + check.status + ' conclusion=' + check.conclusion : 'Cloudflare Pages check not visible yet';
            console.log('PAGES_DEPLOY_WAIT attempt=' + attempt + ' ' + last);
            if (check?.status === 'completed' && check.conclusion === 'success') break;
            if (check?.status === 'completed' && check.conclusion !== 'success') {
              throw new Error('Cloudflare Pages deployment failed: ' + check.conclusion);
            }
            if (attempt === 180) throw new Error('Cloudflare Pages deployment did not complete within 15 minutes. Last: ' + last);
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          NODE
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Run dedicated production referral lifecycle E2E
        run: node e2e/pay-referral-production.e2e.mjs

      - name: Run authenticated production browser UI E2E
        run: node e2e/pay-production-ui.e2e.mjs

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solmint-pay-production-browser-ui
          path: /tmp/pay-ui-evidence
          if-no-files-found: warn