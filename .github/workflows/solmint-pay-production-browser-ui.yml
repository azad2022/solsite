name: SolMint Pay Production Browser UI E2E

on:
  push:
    branches: [main]
    paths:
      - 'e2e/pay-production-ui.e2e.mjs'
      - 'src/pay/**'
      - 'functions/api/pay/**'
      - 'functions/api/auth/**'
      - '.github/workflows/solmint-pay-production-browser-ui.yml'
      - '.github/solmint-pay-production-ui-e2e.trigger'
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  browser-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOLMINT_PAY_PRODUCTION_ORIGIN: https://solmint.ir
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Playwright
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Compare Pages Preview with custom production domain
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const repository = process.env.GITHUB_REPOSITORY;
          const sha = process.env.GITHUB_SHA;
          const customOrigin = process.env.SOLMINT_PAY_PRODUCTION_ORIGIN;
          const headers = {
            authorization: 'Bearer ' + process.env.GITHUB_TOKEN,
            accept: 'application/vnd.github+json',
          };
          let previewOrigin = '';
          let lastPagesState = '';
          for (let attempt = 1; attempt <= 30; attempt += 1) {
            const checksResponse = await fetch(
              'https://api.github.com/repos/' + repository + '/commits/' + sha + '/check-runs?per_page=100',
              { headers },
            );
            if (!checksResponse.ok) throw new Error('GitHub check-runs lookup failed: ' + checksResponse.status);
            const checks = await checksResponse.json();
            const pagesChecks = (checks.check_runs || []).filter((check) => check.name === 'Cloudflare Pages');
            const pagesCheck = pagesChecks.find((check) => check.output?.summary);
            const summary = pagesCheck?.output?.summary || '';
            const previewMatch = summary.match(/https:\/\/[^<\s'"]+\.solsite-9uh\.pages\.dev/);
            lastPagesState = pagesCheck
              ? `status=${pagesCheck.status} conclusion=${pagesCheck.conclusion}`
              : 'missing';
            console.log(`CLOUDFLARE_PAGES_CHECK attempt=${attempt} ${lastPagesState}`);
            if (pagesCheck?.conclusion === 'success' && previewMatch) {
              previewOrigin = previewMatch[0];
              break;
            }
            if (pagesCheck?.conclusion === 'failure') {
              throw new Error('Cloudflare Pages deployment failed for current commit.');
            }
            if (attempt === 30) {
              throw new Error(`Current commit has no successful Cloudflare Pages preview URL. Last: ${lastPagesState}`);
            }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          console.log('PAGES_PREVIEW_ORIGIN ' + previewOrigin);
          const browser = await chromium.launch({ headless: true });
          try {
            for (const [label, targetOrigin] of [['pages-preview', previewOrigin], ['custom-domain', customOrigin]]) {
              const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
              try {
                const probeUrl = targetOrigin + '/pay/merchants?__pay_runtime_probe=' + encodeURIComponent(crypto.randomUUID());
                const response = await page.goto(probeUrl, { waitUntil: 'domcontentloaded', timeout: 20000 });
                await page.waitForTimeout(1000);
                const diagnostics = await page.evaluate(() => ({
                  url: location.href,
                  title: document.title,
                  marker: document.querySelectorAll('[data-pay-runtime="transport-v2"]').length,
                  shell: document.querySelectorAll('.pay-app-shell').length,
                }));
                console.log('PAY_ORIGIN_PROBE ' + JSON.stringify({
                  label,
                  targetOrigin,
                  status: response?.status() || 0,
                  diagnostics,
                  headers: {
                    cacheControl: response?.headers()['cache-control'] || '',
                    etag: response?.headers()['etag'] || '',
                    cfCacheStatus: response?.headers()['cf-cache-status'] || '',
                    cfRay: response?.headers()['cf-ray'] || '',
                    server: response?.headers()['server'] || '',
                  },
                }));
                if (label === 'pages-preview' && (!response?.ok() || diagnostics.marker !== 1 || diagnostics.shell !== 1)) {
                  throw new Error('Current Pay runtime does not render on Pages Preview.');
                }
                if (label === 'custom-domain' && (diagnostics.marker !== 1 || diagnostics.shell !== 1)) {
                  throw new Error('Custom production domain is not serving the current Pay runtime.');
                }
              } finally {
                await page.close();
              }
            }
          } finally {
            await browser.close();
          }
          NODE

      - name: Wait for current production Pay runtime
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const origin = process.env.SOLMINT_PAY_PRODUCTION_ORIGIN;
          const expected = 'transport-v2';
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            let last = '';
            for (let attempt = 1; attempt <= 60; attempt += 1) {
              try {
                const response = await page.goto(`${origin}/pay/merchants`, { waitUntil: 'domcontentloaded', timeout: 15000 });
                const marker = await page.locator(`[data-pay-runtime="${expected}"]`).count().catch(() => 0);
                const title = await page.title().catch(() => '');
                last = `attempt=${attempt} status=${response?.status() ?? 0} marker=${marker} title=${title}`;
                console.log(last);
                if (response?.ok() && marker === 1) {
                  console.log('Production Pay runtime is current.');
                  process.exitCode = 0;
                  break;
                }
              } catch (error) {
                last = `attempt=${attempt} error=${error instanceof Error ? error.message : String(error)}`;
                console.log(last);
              }
              if (attempt === 60) {
                throw new Error(`Production Pay runtime did not become current after 5 minutes. Last: ${last}`);
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
          } finally {
            await browser.close();
          }
          NODE

      - name: Run authenticated production browser UI E2E
        run: node e2e/pay-production-ui.e2e.mjs

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solmint-pay-production-browser-ui
          path: /tmp/pay-ui-evidence
          if-no-files-found: warn