name: _TEMP SolMint Pay Authenticated E2E

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  authenticated-api-key-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOLMINT_PAY_PRODUCTION_ORIGIN: https://solmint.ir
      PAY_E2E_EMAIL: ${{ secrets.PAY_E2E_EMAIL }}
      PAY_E2E_PASSWORD: ${{ secrets.PAY_E2E_PASSWORD }}
      PAY_E2E_MERCHANT_ID: ${{ secrets.PAY_E2E_MERCHANT_ID }}
      PAY_E2E_OTHER_MERCHANT_ID: ${{ secrets.PAY_E2E_OTHER_MERCHANT_ID }}
    steps:
      - name: Checkout E2E branch
        uses: actions/checkout@v5
        with:
          ref: test/pay-authenticated-api-key-e2e
          persist-credentials: false
      - name: Wait for Cloudflare Pages deployment of this main commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            status=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
              | jq -r '[.check_runs[] | select(.name == "Cloudflare Pages")][0] | [.status, (.conclusion // "") ] | @tsv')
            read -r state conclusion <<< "$status"
            echo "Cloudflare Pages: state=${state:-missing} conclusion=${conclusion:-pending}"
            if [ "$state" = "completed" ] && [ "$conclusion" = "success" ]; then exit 0; fi
            if [ "$state" = "completed" ] && [ "$conclusion" = "failure" ]; then
              echo "Cloudflare Pages deployment failed for ${GITHUB_SHA}." >&2
              exit 1
            fi
            sleep 10
          done
          echo 'Timed out waiting for Cloudflare Pages deployment.' >&2
          exit 1
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Install dependencies (immutable)
        run: bun install --frozen-lockfile
      - name: Require controlled merchant E2E configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PAY_E2E_EMAIL"
          test -n "$PAY_E2E_PASSWORD"
          test -n "$PAY_E2E_MERCHANT_ID"
          test -n "$PAY_E2E_OTHER_MERCHANT_ID"
      - name: Verify password secret fingerprint
        shell: bash
        run: |
          set -euo pipefail
          actual="$(printf '%s' "$PAY_E2E_PASSWORD" | sha256sum | cut -d ' ' -f1)"
          expected="cbcba802b4c591b1445a2bd58641f617863b671476072538e11360941addec07"
          test "$actual" = "$expected"
      - name: Run authenticated production API-key lifecycle E2E
        run: bun run test:e2e:pay-authenticated
      - name: Assert source tree is unchanged
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
# temporary validation harness
