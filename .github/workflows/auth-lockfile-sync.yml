name: Auth — Lockfile Synchronization

on:
  push:
    branches: [feat/auth-better-auth-postgres-runtime]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[auth-lock-sync]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/auth-better-auth-postgres-runtime
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Synchronize lockfile
        run: bun install --no-frozen-lockfile

      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore(auth): synchronize Bun lockfile [auth-lock-sync]"
          git push origin HEAD:feat/auth-better-auth-postgres-runtime
