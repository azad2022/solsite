name: SolMint Pay Wallet Ownership E2E Autonomous

on:
  push:
    branches:
      - main
    paths:
      - .github/solmint-pay-actions-probe.trigger

permissions:
  contents: read

concurrency:
  group: solmint-pay-wallet-ownership-autonomous
  cancel-in-progress: false

jobs:
  wallet-ownership-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Wallet Ownership test ref
        uses: actions/checkout@v5
        with:
          ref: test/pay-wallet-ownership-e2e-on-114

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Validate required controlled configuration
        env:
          PAY_E2E_OTHER_MERCHANT_ID: ${{ secrets.PAY_E2E_OTHER_MERCHANT_ID }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PAY_E2E_OTHER_MERCHANT_ID"
          test -n "$SUPABASE_DB_URL"
          test -n "$SUPABASE_DB_PASSWORD"
          node --input-type=module <<'NODE'
          const raw = process.env.SUPABASE_DB_URL?.trim();
          if (!raw) throw new Error('SUPABASE_DB_URL is required.');
          const url = new URL(raw);
          const host = url.hostname.toLowerCase();
          if (!(host.endsWith('.pooler.supabase.com') && url.port === '5432')) {
            throw new Error('SUPABASE_DB_URL must use the Supabase shared Session pooler on port 5432.');
          }
          NODE

      - name: Verify E2E sources exist
        run: |
          set -euo pipefail
          test -f e2e/pay-wallet-ownership-lifecycle.e2e.ts
          test -f functions/api/pay/v1/merchants/[merchantId]/wallet-challenges.ts
          test -f functions/api/pay/v1/merchants/[merchantId]/wallet-challenges/[challengeId].ts

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run authenticated Wallet Ownership lifecycle E2E
        env:
          SOLMINT_PAY_PRODUCTION_ORIGIN: https://solmint.ir
          PAY_E2E_OTHER_MERCHANT_ID: ${{ secrets.PAY_E2E_OTHER_MERCHANT_ID }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: bunx tsx e2e/pay-wallet-ownership-lifecycle.e2e.ts
