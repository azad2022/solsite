name: Apply SEO Production Hardening

on:
  push:
    branches: [seo-production-hardening]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor == 'azad2022'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply production SEO fixes
        shell: python
        run: |
          from pathlib import Path

          root = Path('.')

          markdown_util = root / 'src/utils/articleMarkdown.ts'
          markdown_util.parent.mkdir(parents=True, exist_ok=True)
          markdown_util.write_text(r'''const escapeHtml = (value: string): string =>
  value
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');

const safeHref = (value: string): string => {
  const href = value.trim();
  if (/^(https?:\\/\\/|mailto:|\\/|#)/i.test(href)) return href;
  return '#';
};

const renderInlineMarkdown = (value: string): string => {
  let html = escapeHtml(value);
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\\*\\*([^*]+)\\*\\*/g, '<strong>$1</strong>');
  html = html.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  html = html.replace(/\\*([^*]+)\\*/g, '<em>$1</em>');
  html = html.replace(/_([^_]+)_/g, '<em>$1</em>');
  html = html.replace(/!\\[([^\\]]*)\\]\\(([^)]+)\\)/g, (_m, alt, src) => {
    const safeSrc = safeHref(src);
    return `<img src="${safeSrc}" alt="${alt}" loading="lazy" decoding="async" />`;
  });
  html = html.replace(/\\[([^\\]]+)\\]\\(([^)]+)\\)/g, (_m, label, href) => {
    const safe = safeHref(href);
    const external = /^https?:\\/\\//i.test(safe);
    return `<a href="${safe}"${external ? ' target="_blank" rel="noopener noreferrer"' : ''}>${label}</a>`;
  });
  return html;
};

/**
 * Converts the CMS/DeepSeek Markdown article format to safe semantic HTML.
 * Raw HTML is escaped rather than executed so article content cannot inject markup.
 */
export function renderArticleMarkdownToHtml(markdown: string): string {
  const source = String(markdown || '').replace(/\\r\\n?/g, '\\n').trim();
  if (!source) return '';

  const lines = source.split('\\n');
  const output: string[] = [];
  let paragraph: string[] = [];
  let listType: 'ul' | 'ol' | null = null;
  let listItems: string[] = [];
  let inCode = false;
  let codeLanguage = '';
  let codeLines: string[] = [];

  const flushParagraph = () => {
    if (!paragraph.length) return;
    const text = paragraph.join(' ').trim();
    if (text) output.push(`<p>${renderInlineMarkdown(text)}</p>`);
    paragraph = [];
  };

  const flushList = () => {
    if (!listType || !listItems.length) return;
    output.push(`<${listType}>${listItems.map(item => `<li>${renderInlineMarkdown(item)}</li>`).join('')}</${listType}>`);
    listType = null;
    listItems = [];
  };

  const flushCode = () => {
    if (!inCode) return;
    const languageClass = codeLanguage ? ` class="language-${escapeHtml(codeLanguage)}"` : '';
    output.push(`<pre><code${languageClass}>${escapeHtml(codeLines.join('\\n'))}</code></pre>`);
    inCode = false;
    codeLanguage = '';
    codeLines = [];
  };

  for (const rawLine of lines) {
    const line = rawLine.trimEnd();

    if (line.trim().startsWith('```')) {
      if (!inCode) {
        flushParagraph();
        flushList();
        inCode = true;
        codeLanguage = line.trim().slice(3).trim();
        codeLines = [];
      } else {
        flushCode();
      }
      continue;
    }

    if (inCode) {
      codeLines.push(line);
      continue;
    }

    if (!line.trim()) {
      flushParagraph();
      flushList();
      continue;
    }

    const heading = line.match(/^(#{1,3})\\s+(.+)$/);
    if (heading) {
      flushParagraph();
      flushList();
      const level = heading[1].length;
      output.push(`<h${level}>${renderInlineMarkdown(heading[2].trim())}</h${level}>`);
      continue;
    }

    if (/^---+$/.test(line.trim())) {
      flushParagraph();
      flushList();
      output.push('<hr />');
      continue;
    }

    const quote = line.match(/^>\\s?(.*)$/);
    if (quote) {
      flushParagraph();
      flushList();
      output.push(`<blockquote>${renderInlineMarkdown(quote[1])}</blockquote>`);
      continue;
    }

    const unordered = line.match(/^[-*]\\s+(.+)$/);
    if (unordered) {
      flushParagraph();
      if (listType && listType !== 'ul') flushList();
      listType = 'ul';
      listItems.push(unordered[1]);
      continue;
    }

    const ordered = line.match(/^\\d+[.)]\\s+(.+)$/);
    if (ordered) {
      flushParagraph();
      if (listType && listType !== 'ol') flushList();
      listType = 'ol';
      listItems.push(ordered[1]);
      continue;
    }

    paragraph.push(line.trim());
  }

  flushParagraph();
  flushList();
  flushCode();

  return output.join('\\n');
}
