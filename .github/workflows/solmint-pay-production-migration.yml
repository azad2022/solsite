name: SolMint Pay Production Migration

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Apply all pending repository migrations to SolMint Pay Production'
        required: true
        default: 'NO'
        type: choice
        options:
          - 'NO'
          - 'APPLY'

permissions:
  contents: read

concurrency:
  group: solmint-pay-production-migration
  cancel-in-progress: false

env:
  # Supavisor session-mode endpoint keeps production migration CI on IPv4-capable
  # infrastructure without requiring Supabase Management API access. The region
  # matches the current production project metadata (eu-central-1).
  SUPABASE_DB_URL: postgresql://postgres.nvopkbiedorfshwbmyhn@aws-0-eu-central-1.pooler.supabase.com:5432/postgres
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  migrate:
    if: inputs.confirm == 'APPLY'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: latest

      - name: Require production credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo "ERROR: required GitHub Actions secret SUPABASE_DB_PASSWORD is missing or empty."
            exit 1
          fi
          echo "Production migration database credentials are present (values are not printed)."

      - name: Preview pending migrations
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run

      - name: Apply pending migrations
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --db-url "$SUPABASE_DB_URL"

      - name: Verify migration state
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
