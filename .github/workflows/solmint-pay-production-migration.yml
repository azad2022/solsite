name: SolMint Pay Production Migration

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Apply all pending repository migrations to SolMint Pay Production'
        required: true
        default: 'NO'
        type: choice
        options:
          - 'NO'
          - 'APPLY'

permissions:
  contents: read

concurrency:
  group: solmint-pay-production-migration
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: nvopkbiedorfshwbmyhn
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  migrate:
    if: inputs.confirm == 'APPLY'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: latest

      - name: Require production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_PROJECT_ID"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"

      - name: Link Production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preview pending migrations
        run: supabase db push --dry-run

      - name: Apply pending migrations
        run: supabase db push

      - name: Verify migration state
        run: supabase migration list
