name: SolMint Pay Production Migration

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'NO skips; DRY_RUN previews migrations without writes; APPLY applies all pending repository migrations to Production.'
        required: true
        default: 'NO'
        type: choice
        options:
          - 'NO'
          - 'DRY_RUN'
          - 'APPLY'

permissions:
  contents: read

concurrency:
  group: solmint-pay-production-migration
  cancel-in-progress: false

env:
  # Use the existing connection URI secret copied from Supabase Dashboard → Connect.
  # Any password embedded in the URI is stripped; PGPASSWORD is the sole password source.
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  migrate:
    if: inputs.confirm == 'APPLY' || inputs.confirm == 'DRY_RUN'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: latest

      - name: Require production credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_DB_URL" ]]; then
            echo "ERROR: required GitHub Actions secret SUPABASE_DB_URL is missing or empty."
            exit 1
          fi
          if [[ -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo "ERROR: required GitHub Actions secret SUPABASE_DB_PASSWORD is missing or empty."
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const raw = process.env.SUPABASE_DB_URL;
          let uri;
          try {
            uri = new URL(raw);
          } catch {
            console.error('ERROR: SUPABASE_DB_URL is not a valid PostgreSQL connection URI.');
            process.exit(1);
          }
          if (!['postgres:', 'postgresql:'].includes(uri.protocol) || !uri.hostname || !uri.username || !uri.pathname || uri.pathname === '/') {
            console.error('ERROR: SUPABASE_DB_URL must be a PostgreSQL URI with host, username, and database path.');
            process.exit(1);
          }
          const hadEmbeddedPassword = uri.password.length > 0;
          uri.password = '';
          appendFileSync(process.env.GITHUB_ENV, 'SUPABASE_DB_URL_SANITIZED=' + uri.toString() + '\n');
          console.log(
            'PostgreSQL connection URI validated: ' +
            'host=' + uri.hostname +
            ', port=' + (uri.port || '5432') +
            ', embedded_password_removed=' + (hadEmbeddedPassword ? 'yes' : 'not-needed')
          );
          NODE
          echo "Production migration credential sources are present (values are not printed)."

      - name: Preview pending migrations
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --db-url "$SUPABASE_DB_URL_SANITIZED" --dry-run

      - name: Apply pending migrations
        if: inputs.confirm == 'APPLY'
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --db-url "$SUPABASE_DB_URL_SANITIZED"

      - name: Verify migration state
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --db-url "$SUPABASE_DB_URL_SANITIZED"
