name: SolMint Pay Production Migration

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'NO skips; AUTH_PROBE tests direct DB authentication only; DRY_RUN previews migrations without writes; APPLY applies all pending repository migrations to Production.'
        required: true
        default: 'NO'
        type: choice
        options:
          - 'NO'
          - 'AUTH_PROBE'
          - 'DRY_RUN'
          - 'APPLY'
      expected_main_sha:
        description: 'Required for APPLY: paste the full 40-character commit SHA shown for the selected main branch run. The workflow rejects stale or different SHAs.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: solmint-pay-production-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: inputs.confirm == 'APPLY' || inputs.confirm == 'DRY_RUN' || inputs.confirm == 'AUTH_PROBE'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact workflow event commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require exact main commit for Production APPLY
        if: inputs.confirm == 'APPLY'
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: node scripts/solmint-pay-production-migration-guard.mjs assert-apply-ref

      - name: Setup Supabase CLI
        if: inputs.confirm == 'DRY_RUN' || inputs.confirm == 'APPLY'
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: latest

      - name: Require standalone Production database password
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo "::error::Required GitHub Actions secret SUPABASE_DB_PASSWORD is missing or empty."
            exit 1
          fi
          echo "Standalone Production database password is present (value is not printed)."

      - name: Validate exact SolMint Production Session Pooler target
        if: inputs.confirm == 'DRY_RUN' || inputs.confirm == 'APPLY'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node scripts/solmint-pay-production-migration-guard.mjs validate-target

      - name: Read-only direct PostgreSQL authentication probe
        if: inputs.confirm == 'AUTH_PROBE'
        env:
          PGHOST: db.nvopkbiedorfshwbmyhn.supabase.co
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: postgres
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLMODE: require
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          if result="$(psql --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command 'SELECT current_database();' 2>&1)"; then
            if [[ "$result" != 'postgres' ]]; then
              echo "ERROR: direct PostgreSQL authentication succeeded, but the database name was unexpected."
              exit 1
            fi
            echo "Direct PostgreSQL authentication probe PASSED. The configured GitHub credential is accepted by PostgreSQL."
          else
            psql_status=$?
            if grep -Eqi '28P01|password authentication failed' <<< "$result"; then
              echo "Direct PostgreSQL endpoint REJECTED the configured GitHub credential with SQLSTATE 28P01."
            elif grep -Eqi 'network is unreachable|no route to host|could not translate host name|timeout expired|connection refused|could not connect' <<< "$result"; then
              echo "Direct PostgreSQL endpoint was unreachable from this runner; the credential test is INCONCLUSIVE (network/IPv6/endpoint path)."
            else
              echo "Direct PostgreSQL probe failed for a different connection reason; detailed output is omitted. The credential test is INCONCLUSIVE."
            fi
            exit "$psql_status"
          fi

      - name: Read-only PostgreSQL authentication probe via Session Pooler
        if: inputs.confirm == 'DRY_RUN'
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLMODE: require
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          database_name="$(psql --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --dbname "$SUPABASE_DB_URL_SANITIZED" --command 'SELECT current_database();')"
          if [[ "$database_name" != "postgres" ]]; then
            echo "ERROR: PostgreSQL authentication succeeded, but the configured Production database is not the expected database."
            exit 1
          fi
          echo "Read-only psql authentication probe passed for the configured Production database. No data or schema was changed."

      - name: Preview pending migrations
        if: inputs.confirm == 'DRY_RUN' || inputs.confirm == 'APPLY'
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --db-url "$SUPABASE_DB_URL_SANITIZED" --dry-run

      - name: Apply pending migrations
        if: inputs.confirm == 'APPLY'
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --db-url "$SUPABASE_DB_URL_SANITIZED"

      - name: Verify migration state
        if: inputs.confirm == 'APPLY'
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --db-url "$SUPABASE_DB_URL_SANITIZED"
