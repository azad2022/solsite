name: CI

on:
  push:
    branches: [main, production-hardening, seo-stage2-production-hardening, seo-stage3-admin-cms]
  pull_request:
    branches: [main, seo-stage2-production-hardening]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck production source
        run: bunx tsc --noEmit -p tsconfig.ci.json

      - name: Production build
        run: bunx vite build && node scripts/ensure-pages-routes.mjs && bunx esbuild server.ts --bundle --platform=node --format=cjs --packages=external --sourcemap --outfile=dist/server.cjs

      - name: Unit tests
        run: find tests -type f -name '*.test.ts' -print0 | xargs -0 bunx tsx --test

      - name: Assert source tree is unchanged
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  subscription-sdk-compat:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/pay-subscription-billing' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [24]
    defaults:
      run:
        working-directory: tools/subscription-sdk-compat
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact PR head checkout
        env:
          EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'EXPECTED_PR_HEAD=%s\nACTUAL_CHECKOUT_HEAD=%s\n' "$EXPECTED_PR_HEAD" "$actual"
          test "$actual" = "$EXPECTED_PR_HEAD"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Record runtime and package-manager policy
        run: |
          node --version
          npm --version
          npm config set engine-strict true
          npm config get engine-strict

      - name: Verify committed lockfile matches the pinned manifest
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package-lock.json

      - name: Install isolated dependency graph
        run: npm ci --no-audit --no-fund

      - name: Report installed dependency versions and engine requirements
        run: |
          npm ls --depth=0
          node --input-type=module -e "import { createRequire } from 'node:module'; import { readFileSync } from 'node:fs'; import { dirname, join } from 'node:path'; const require = createRequire(import.meta.url); for (const name of ['@solana/subscriptions','@solana/kit','@solana-program/token','@solana-program/token-2022','@solana/web3.js']) { let dir = dirname(require.resolve(name)); for (;;) { const candidate = join(dir, 'package.json'); try { const pkg = JSON.parse(readFileSync(candidate, 'utf8')); if (pkg.name === name) { console.log(name + '@' + pkg.version + ' engines=' + JSON.stringify(pkg.engines ?? {})); break; } } catch {} const parent = dirname(dir); if (parent === dir) throw new Error('package.json not found: ' + name); dir = parent; } }"

      - name: Setup Bun for repository TypeScript compiler
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install pinned root TypeScript toolchain
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Typecheck Subscription adapter and SDK builder integration
        run: npm run typecheck

      - name: Execute SDK / PDA / web3.js transaction compatibility tests
        run: npm test

      - name: Execute SDK integration in local Cloudflare Pages Workerd runtime
        run: npm run test:workerd

      - name: Simulate Subscription CreatePlan on dedicated Devnet RPC (no submission)
        env:
          SOLANA_DEVNET_RPC_URL: ${{ secrets.SOLANA_DEVNET_RPC_URL }}
        run: npm run test:devnet-sim

  subscription-reproducible-build:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/pay-subscription-billing' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      elf_sha256: ${{ steps.hash.outputs.elf_sha256 }}
      idl_sha256: ${{ steps.hash.outputs.idl_sha256 }}
    steps:
      - name: Checkout pinned upstream Program source
        uses: actions/checkout@v5
        with:
          repository: solana-foundation/subscriptions
          ref: 364a41976c33347d092902443bbec2def9227e75
          path: upstream-subscriptions
          persist-credentials: false

      - name: Verify exact upstream source commit and toolchain pins
        working-directory: upstream-subscriptions
        run: |
          test "$(git rev-parse HEAD)" = "364a41976c33347d092902443bbec2def9227e75"
          grep -F 'solana = "3.1.10"' Cargo.toml
          grep -F 'channel = "1.92"' rust-toolchain.toml
          grep -F 'name = "subscriptions_program"' program/Cargo.toml

      - name: Download pinned solana-verify CLI and verify release checksum
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/solana-foundation/solana-verifiable-build/releases/download/v0.5.2/solana-verify-0.5.2-linux \
            --output solana-verify
          echo "b9d5ccce9634dc14269cab3e7a58649bc141b3306e7735a94478c936341f211f  solana-verify" | sha256sum --check -
          chmod 0755 solana-verify
          ./solana-verify --version

      - name: Build pinned source in deterministic Solana Docker image (no RPC)
        id: build
        working-directory: upstream-subscriptions
        run: |
          set -o pipefail
          ../solana-verify build "$GITHUB_WORKSPACE/upstream-subscriptions" --workspace-path "$GITHUB_WORKSPACE/upstream-subscriptions" --library-name subscriptions_program 2>&1 | tee "$RUNNER_TEMP/subscription-build.log"
          container_rust_toolchain="$(sed -n 's/^Using container Rust toolchain: //p' "$RUNNER_TEMP/subscription-build.log" | tail -n 1)"
          if [ -z "$container_rust_toolchain" ]; then
            echo "::error::Could not capture the actual Solana build container Rust toolchain"
            exit 1
          fi
          echo "container_rust_toolchain=$container_rust_toolchain" >> "$GITHUB_OUTPUT"

      - name: Compute reproducible executable hash
        id: hash
        working-directory: upstream-subscriptions
        env:
          CONTAINER_RUST_TOOLCHAIN: ${{ steps.build.outputs.container_rust_toolchain }}
        run: |
          set -euo pipefail
          binary="$(find "$GITHUB_WORKSPACE/upstream-subscriptions/target/deploy" -name 'subscriptions_program.so' -type f -print -quit)"
          if [ -z "$binary" ]; then
            echo "::error::Pinned verified build did not produce subscriptions_program.so"
            find "$GITHUB_WORKSPACE/upstream-subscriptions" -name '*.so' -type f -print
            exit 1
          fi
          hash="$(../solana-verify get-executable-hash "$binary")"
          if ! [[ "$hash" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::solana-verify returned an invalid executable hash"
            exit 1
          fi
          echo "elf_sha256=$hash" >> "$GITHUB_OUTPUT"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          printf '{"source_commit":"364a41976c33347d092902443bbec2def9227e75","solana_verify_version":"0.5.2","solana_cli_build_version":"3.1.10","rust_toolchain_file":"1.92","build_container_rust_toolchain":"%s","docker_image_digest":"sha256:f71be5ca7620b7e40933b7f1294fa44e01d08c1fc5ba1f375a2478f5a01580d3","elf_sha256":"%s"}\n' "$CONTAINER_RUST_TOOLCHAIN" "$hash" > "$GITHUB_WORKSPACE/artifacts/subscription-program-reproducible-build.json"
          printf 'Pinned source commit: 364a41976c33347d092902443bbec2def9227e75\nBuild container Rust toolchain: %s\nReproducible ELF SHA-256: %s\n' "$CONTAINER_RUST_TOOLCHAIN" "$hash"

      - name: Upload sanitized reproducible build evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: solmint-subscription-reproducible-build
          path: artifacts/subscription-program-reproducible-build.json
          if-no-files-found: error
          retention-days: 30

  subscription-mainnet-programdata:
    needs: subscription-reproducible-build
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/pay-subscription-billing' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/subscription-sdk-compat
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact PR head checkout
        env:
          EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_PR_HEAD"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Require dedicated Mainnet RPC secret without displaying it
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: |
          if [ -z "$SOLANA_RPC_URL" ]; then
            echo "::error::Repository secret SOLANA_RPC_URL is required for read-only Mainnet ProgramData verification; no public RPC fallback is permitted."
            exit 1
          fi
          case "$SOLANA_RPC_URL" in
            https://*) ;;
            *) echo "::error::SOLANA_RPC_URL must use HTTPS."; exit 1 ;;
          esac

      - name: Install isolated SDK dependency graph
        run: npm ci --no-audit --no-fund

      - name: Read Mainnet Program and ProgramData metadata
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          EXPECTED_PROGRAM_ELF_SHA256: ${{ needs.subscription-reproducible-build.outputs.elf_sha256 }}
          EXPECTED_SUBSCRIPTION_IDL_SHA256: ${{ needs.subscription-reproducible-build.outputs.idl_sha256 }}
        run: npm run test:mainnet-programdata

      - name: Upload sanitized ProgramData evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: solmint-subscription-mainnet-programdata
          path: tools/subscription-sdk-compat/artifacts/subscription-mainnet-programdata.json
          if-no-files-found: error
          retention-days: 30
