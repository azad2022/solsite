  subscription-vnext-squads-sdk:
    needs: subscription-change-scope
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/pay-subscription-billing' && github.event.pull_request.head.repo.full_name == github.repository && needs.subscription-change-scope.outputs.squads_sdk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact VNext fork source
        uses: actions/checkout@v5
        with:
          repository: azad2022/solmint-subscriptions-program
          ref: 04569d883c2d91ab4b973913266e495f19d034bf
          persist-credentials: false

      - name: Verify exact fork commit
        run: |
          actual="$(git rev-parse HEAD)"
          expected="04569d883c2d91ab4b973913266e495f19d034bf"
          test "$actual" = "$expected"

      - name: Install pinned Rust, Solana, pnpm and Surfpool toolchain
        id: toolchain_setup
        uses: ./.github/actions/setup
        with:
          enable-rust-cache: 'true'
          save-rust-cache: 'true'
          install-surfpool: 'true'
          rust-cache-key: 'solmint-squads-delayed-proposal'
          solana-version: '4.0.0'
          surfpool-version: '1.3.1'

      - name: Build VNext program, transfer-hook fixture and generated clients
        id: vnext_build
        run: just build-program build-test-hook generate-clients

      - name: Start isolated Surfpool fork
        run: just _start-surfpool fork

      - name: Run staged Squads SDK unit tests
        working-directory: clients/typescript
        run: pnpm exec vitest run --config vitest.config.ts test/smart-wallets/squadsWallet.test.ts

      - name: Run real delayed Squads proposal integration
        working-directory: clients/typescript
        env:
          RUN_SQUADS_DELAYED_PROPOSAL_E2E: '1'
          SOLANA_RPC_URL: http://127.0.0.1:8899
        run: pnpm exec vitest run --config vitest.config.ts test/smart-wallets/squadsDelayedProposal.integration.test.ts

      - name: Stop isolated Surfpool
        if: always()
        run: just kill-validator

      - name: Verify the pinned Agave local validator is installed
        if: ${{ always() && steps.toolchain_setup.outcome == 'success' && steps.vnext_build.outcome == 'success' }}
        run: |
          set -euo pipefail
          command -v solana-test-validator
          solana-test-validator --version

      - name: Resolve the exact VNext SBF artifact built from this checkout
        if: ${{ always() && steps.toolchain_setup.outcome == 'success' && steps.vnext_build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          program_so="$(find "$GITHUB_WORKSPACE" -type f -path '*/target/deploy/subscriptions_program.so' -print -quit)"
          test -n "$program_so"
          test -s "$program_so"
          printf 'SOLMINT_VNEXT_PROGRAM_SO=%s\n' "$program_so" >> "$GITHUB_ENV"
          sha256sum "$program_so"

      - name: Typecheck the Agave durable nonce regression test
        if: ${{ always() && steps.toolchain_setup.outcome == 'success' && steps.vnext_build.outcome == 'success' }}
        working-directory: clients/typescript
        run: |
          set -euo pipefail
          pnpm exec tsc --noEmit --target ES2022 --module ESNext --moduleResolution bundler --lib ES2022 --types node --strict --skipLibCheck --esModuleInterop --allowImportingTsExtensions test/smart-wallets/durableNonceAgave.integration.test.ts

      - name: Prove durable nonce failure semantics on the Agave test validator
        if: ${{ always() && steps.toolchain_setup.outcome == 'success' && steps.vnext_build.outcome == 'success' }}
        working-directory: clients/typescript
        env:
          RUN_DURABLE_NONCE_AGAVE_E2E: '1'
        run: |
          set -euo pipefail
          pnpm exec vitest run --config vitest.config.ts test/smart-wallets/durableNonceAgave.integration.test.ts

  subscription-vnext-authority-registry:
    needs: [subscription-reproducible-build, subscription-change-scope]
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/pay-subscription-billing' && github.event.pull_request.head.repo.full_name == github.repository && needs.subscription-change-scope.outputs.vnext == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact SolMint VNext fork commit
        uses: actions/checkout@v5
        with:
          repository: azad2022/solmint-subscriptions-program
          ref: d20de416b128adef1c03f6bca8a29c576c025cc9
          path: vnext-subscriptions
          persist-credentials: false

      - name: Verify immutable VNext source commit
        working-directory: vnext-subscriptions
        run: |
          actual="$(git rev-parse HEAD)"
          expected="d20de416b128adef1c03f6bca8a29c576c025cc9"
          printf 'EXPECTED_VNEXT_SHA=%s\nACTUAL_VNEXT_SHA=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: '1.92'
          components: rustfmt, clippy

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: 'vnext-subscriptions -> vnext-subscriptions/target'
          shared-key: solmint-vnext-authority-registry

      - name: Check Program Rust formatting
        working-directory: vnext-subscriptions
        run: cargo fmt -p subscriptions-program -- --check

      - name: Check LiteSVM test Rust formatting
        working-directory: vnext-subscriptions
        run: cargo fmt -p tests-subscriptions -- --check

      - name: Run Program unit tests
        working-directory: vnext-subscriptions
        run: cargo test -p subscriptions-program

      - name: Download checksum-verified solana-verify artifact from reproducible build
        uses: actions/download-artifact@v4
        with:
          name: solmint-subscription-reproducible-build
          path: ${{ github.workspace }}

      - name: Re-verify pinned solana-verify CLI checksum
        run: |
          test -s solana-verify
          echo "b9d5ccce9634dc14269cab3e7a58649bc141b3306e7735a94478c936341f211f  solana-verify" | sha256sum --check -
          chmod 0755 solana-verify
          ./solana-verify --version

      - name: Build exact VNext SBF artifact in deterministic container
        working-directory: vnext-subscriptions
        run: |
          set -euo pipefail
          ../solana-verify build "$GITHUB_WORKSPACE/vnext-subscriptions" \
            --workspace-path "$GITHUB_WORKSPACE/vnext-subscriptions" \
            --library-name subscriptions_program
          test -s target/deploy/subscriptions_program.so
          sha256sum target/deploy/subscriptions_program.so

      - name: Build Token-2022 transfer-hook test fixture
        working-directory: vnext-subscriptions
        run: |
          set -euo pipefail
          ../solana-verify build "$GITHUB_WORKSPACE/vnext-subscriptions/tests/transfer-hook-example" \
            --workspace-path "$GITHUB_WORKSPACE/vnext-subscriptions/tests/transfer-hook-example" \
            --library-name transfer_hook_example
          test -s tests/transfer-hook-example/target/deploy/transfer_hook_example.so

      - name: Run complete LiteSVM integration suite against VNext SBF
        working-directory: vnext-subscriptions
        run: cargo test -p tests-subscriptions

      - name: Checkout immutable v0.5.0 legacy Program source
        uses: actions/checkout@v5
        with:
          repository: solana-foundation/subscriptions
          ref: 364a41976c33347d092902443bbec2def9227e75
          path: legacy-subscriptions
          persist-credentials: false

      - name: Build immutable legacy Program SBF for isolation testing
        working-directory: legacy-subscriptions
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "364a41976c33347d092902443bbec2def9227e75"
          ../solana-verify build "$GITHUB_WORKSPACE/legacy-subscriptions" \
            --workspace-path "$GITHUB_WORKSPACE/legacy-subscriptions" \
            --library-name subscriptions_program
          test -s target/deploy/subscriptions_program.so

      - name: Prove immutable legacy Program cannot delegate a VNext non-ATA source
        working-directory: vnext-subscriptions
        env:
          SOLMINT_LEGACY_PROGRAM_SO: ${{ github.workspace }}/legacy-subscriptions/target/deploy/subscriptions_program.so
        run: cargo test -p tests-subscriptions vnext_legacy_program_ -- --ignored

      - name: Regenerate Codama IDL from exact Rust source
        working-directory: vnext-subscriptions
        run: GENERATE_IDL=1 cargo check -p subscriptions-program

      - name: Verify generated Codama IDL matches committed VNext IDL
        working-directory: vnext-subscriptions
        run: |
          set -euo pipefail
          git show HEAD:idl/subscriptions.json > /tmp/committed-subscriptions-idl.json
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          generated = json.loads(Path("idl/subscriptions.json").read_text())
          committed = json.loads(Path("/tmp/committed-subscriptions-idl.json").read_text())
          if generated != committed:
              raise SystemExit("Generated Codama IDL differs structurally from the committed IDL")

          canonical = json.dumps(generated, sort_keys=True, separators=(",", ":")).encode()
          print("PASS: generated and committed IDL are structurally identical")
          print(f"Canonical IDL SHA-256: {hashlib.sha256(canonical).hexdigest()}")
          print(f"Instructions: {len(generated['program']['instructions'])}")
          print(f"Accounts: {len(generated['program']['accounts'])}")
          print(f"Defined types: {len(generated['program']['definedTypes'])}")
          print(f"PDAs: {len(generated['program']['pdas'])}")
          PY

      - name: Upload exact VNext SBF, generated IDL and build hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solmint-vnext-authority-registry-build
          path: |
            vnext-subscriptions/target/deploy/subscriptions_program.so
            vnext-subscriptions/idl/subscriptions.json
          if-no-files-found: warn
          retention-days: 14
