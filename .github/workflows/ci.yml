name: CI

on:
  push:
    branches: [main, production-hardening, seo-stage2-production-hardening, seo-stage3-admin-cms]
  pull_request:
    branches: [main, seo-stage2-production-hardening]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: node scripts/fix-auth-pbkdf2-buffers.mjs && node scripts/repair-production-types.mjs && npm run lint

      - name: Production build
        run: npm run build

      - name: Unit tests
        run: bun test tests/**/*.test.ts
