name: Run semantic article migration trigger

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.user.login != 'github-actions[bot]' && startsWith(github.event.issue.title, '[seo-migration]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply semantic Markdown renderer
        run: python3 scripts/apply-semantic-markdown-seo.py
      - name: Validate production build
        run: npm install && npm run lint && npm run build
      - name: Commit production change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/markdownRenderer.ts src/components/BlogHub.tsx server.ts src/index.css
          git diff --cached --quiet && { echo "No changes to commit."; exit 0; }
          git commit -m "fix: render article markdown as semantic HTML for SEO"
          git push origin HEAD:main
      - name: Close trigger issue
        if: github.event_name == 'issues'
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
