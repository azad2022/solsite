name: SolMint Pay — Normalize Final Release Counts (temporary)

on:
  push:
    branches:
      - audit/solmint-pay-next

permissions:
  contents: write

concurrency:
  group: solmint-pay-normalize-counts-now
  cancel-in-progress: false

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Normalize current release assertions
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
            '.github/workflows/solmint-pay-release-evidence.yml': [
              ("PAY_MIGRATION_COUNT: '52'", "PAY_MIGRATION_COUNT: '54'"),
              ("ACTIVE_SQL_COUNT: '53'", "ACTIVE_SQL_COUNT: '55'"),
              ('test "${#expected[@]}" -eq 52', 'test "${#expected[@]}" -eq 54'),
              ('test "${#proposed[@]}" -eq 52', 'test "${#proposed[@]}" -eq 54'),
              ("= '53'", "= '55'"),
              ("= '52'", "= '54'"),
            ],
            '.github/workflows/solmint-pay-baseline-materialize.yml': [
              ("PAY_MIGRATION_COUNT: '52'", "PAY_MIGRATION_COUNT: '54'"),
              ("CANONICAL_ACTIVE_SQL_COUNT: '53'", "CANONICAL_ACTIVE_SQL_COUNT: '55'"),
            ],
            '.github/workflows/solmint-pay-baseline-migration-replay.yml': [
              ("PAY_MIGRATION_COUNT: '51'", "PAY_MIGRATION_COUNT: '54'"),
            ],
            '.github/workflows/solmint-pay-migration-history-reconciliation-rehearsal.yml': [
              ("PAY_MIGRATION_COUNT: '52'", "PAY_MIGRATION_COUNT: '54'"),
              ("test \"$count\" = '53'", "test \"$count\" = '55'"),
            ],
            '.github/workflows/solmint-pay-baseline-definition-audit.yml': [
              ("PAY_MIGRATION_COUNT: '52'", "PAY_MIGRATION_COUNT: '54'"),
            ],
            'scripts/solmint-pay/rehearse-migration-history-reconciliation.mjs': [
              ('expectedPayCount = 52', 'expectedPayCount = 54'),
              ('exactly 52 Pay migration versions', 'exactly 54 Pay migration versions'),
            ],
          }
          for name, pairs in replacements.items():
              p = Path(name)
              text = p.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing expected pattern in {name}: {old}')
                  text = text.replace(old, new)
              p.write_text(text)
          PY
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*_solmint_pay_*.sql' | wc -l)" -eq 54
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 55
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/solmint-pay-normalize-counts-now.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/solmint-pay-release-evidence.yml .github/workflows/solmint-pay-baseline-materialize.yml .github/workflows/solmint-pay-baseline-migration-replay.yml .github/workflows/solmint-pay-migration-history-reconciliation-rehearsal.yml .github/workflows/solmint-pay-baseline-definition-audit.yml scripts/solmint-pay/rehearse-migration-history-reconciliation.mjs
          git commit -m 'chore(pay): align release gates with 54 Pay migrations'
          git push origin HEAD:audit/solmint-pay-next
