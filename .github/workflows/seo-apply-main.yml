          # 1) Shared safe Markdown -> semantic HTML renderer.
          (root / 'src/utils/articleMarkdown.ts').write_text(r'''const escapeHtml = (value: string): string =>
  value.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

const safeHref = (value: string): string => /^(https?:\\/\\/|mailto:|\\/|#)/i.test(value.trim()) ? value.trim() : '#';

const renderInlineMarkdown = (value: string): string => {
  let html = escapeHtml(value);
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\\*\\*([^*]+)\\*\\*/g, '<strong>$1</strong>').replace(/__([^_]+)__/g, '<strong>$1</strong>');
  html = html.replace(/\\*([^*]+)\\*/g, '<em>$1</em>').replace(/_([^_]+)_/g, '<em>$1</em>');
  html = html.replace(/!\\[([^\\]]*)\\]\\(([^)]+)\\)/g, (_m, alt, src) => `<img src="${safeHref(src)}" alt="${alt}" loading="lazy" decoding="async" />`);
  html = html.replace(/\\[([^\\]]+)\\]\\(([^)]+)\\)/g, (_m, label, href) => {
    const safe = safeHref(href);
    return `<a href="${safe}"${/^https?:\\/\\//i.test(safe) ? ' target="_blank" rel="noopener noreferrer"' : ''}>${label}</a>`;
  });
  return html;
};

export function renderArticleMarkdownToHtml(markdown: string): string {
  const source = String(markdown || '').replace(/\\r\\n?/g, '\\n').trim();
  if (!source) return '';
  const lines = source.split('\\n');
  const out: string[] = [];
  let paragraph: string[] = [];
  let listType: 'ul' | 'ol' | null = null;
  let listItems: string[] = [];
  let inCode = false;
  let codeLanguage = '';
  let codeLines: string[] = [];

  const flushParagraph = () => { if (paragraph.length) { const t = paragraph.join(' ').trim(); if (t) out.push(`<p>${renderInlineMarkdown(t)}</p>`); paragraph = []; } };
  const flushList = () => { if (listType && listItems.length) out.push(`<${listType}>${listItems.map(i => `<li>${renderInlineMarkdown(i)}</li>`).join('')}</${listType}>`); listType = null; listItems = []; };
  const flushCode = () => { if (inCode) { const cls = codeLanguage ? ` class="language-${escapeHtml(codeLanguage)}"` : ''; out.push(`<pre><code${cls}>${escapeHtml(codeLines.join('\\n'))}</code></pre>`); inCode = false; codeLanguage = ''; codeLines = []; } };

  for (const raw of lines) {
    const line = raw.trimEnd();
    if (line.trim().startsWith('```')) { if (!inCode) { flushParagraph(); flushList(); inCode = true; codeLanguage = line.trim().slice(3).trim(); } else flushCode(); continue; }
    if (inCode) { codeLines.push(line); continue; }
    if (!line.trim()) { flushParagraph(); flushList(); continue; }
    const h = line.match(/^(#{1,3})\\s+(.+)$/);
    if (h) { flushParagraph(); flushList(); out.push(`<h${h[1].length}>${renderInlineMarkdown(h[2].trim())}</h${h[1].length}>`); continue; }
    if (/^---+$/.test(line.trim())) { flushParagraph(); flushList(); out.push('<hr />'); continue; }
    const q = line.match(/^>\\s?(.*)$/);
    if (q) { flushParagraph(); flushList(); out.push(`<blockquote>${renderInlineMarkdown(q[1])}</blockquote>`); continue; }
    const ul = line.match(/^[-*]\\s+(.+)$/);
    if (ul) { flushParagraph(); if (listType === 'ol') flushList(); listType = 'ul'; listItems.push(ul[1]); continue; }
    const ol = line.match(/^\\d+[.)]\\s+(.+)$/);
    if (ol) { flushParagraph(); if (listType === 'ul') flushList(); listType = 'ol'; listItems.push(ol[1]); continue; }
    paragraph.push(line.trim());
  }
  flushParagraph(); flushList(); flushCode();
  return out.join('\\n');
}
''', encoding='utf-8')

          blog = root / 'src/components/BlogHub.tsx'
