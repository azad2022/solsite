name: Sync Bun lockfile

on:
  push:
    branches: [main, feat/pay-payment-link-hosted-checkout]
    paths:
      - package.json
      - bun.lock
      - .github/workflows/sync-bun-lockfile.yml
  pull_request:
    branches: [main]
    paths:
      - package.json
      - bun.lock
      - .github/workflows/sync-bun-lockfile.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.15'

      - name: Verify lockfile synchronization
        run: bun install --frozen-lockfile

  sync-pay-branch:
    if: github.ref == 'refs/heads/feat/pay-payment-link-hosted-checkout' && github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pay branch
        uses: actions/checkout@v4
        with:
          ref: feat/pay-payment-link-hosted-checkout
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.15'

      - name: Regenerate lockfile
        run: bun install --lockfile-only

      - name: Commit synchronized lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock
          git diff --cached --quiet || git commit -m 'chore(pay): synchronize bun lockfile'
          git push origin feat/pay-payment-link-hosted-checkout
