name: Sync Bun lockfile

on:
  push:
    branches: [main]
    paths:
      - package.json
      - bun.lock
      - .github/workflows/sync-bun-lockfile.yml
  pull_request:
    branches: [main]
    paths:
      - package.json
      - bun.lock
      - .github/workflows/sync-bun-lockfile.yml

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.15'

      - name: Verify lockfile synchronization
        run: bun install --frozen-lockfile
