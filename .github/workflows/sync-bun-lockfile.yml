name: Sync Bun lockfile

on:
  push:
    branches: [main]
    paths:
      - package.json
      - bun.lock
      - .github/workflows/sync-bun-lockfile.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Regenerate lockfile
        run: bun install

      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: synchronize bun lockfile"
          git push origin HEAD:main
