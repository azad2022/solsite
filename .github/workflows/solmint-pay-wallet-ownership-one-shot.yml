name: SolMint Pay Wallet Ownership One Shot
# test harness follows canonical production session-pooler configuration

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  wallet-ownership-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOLMINT_PAY_PRODUCTION_ORIGIN: https://solmint.ir
      PAY_E2E_OTHER_MERCHANT_ID: ${{ secrets.PAY_E2E_OTHER_MERCHANT_ID }}
      SUPABASE_DB_URL: postgresql://postgres.nvopkbiedorfshwbmyhn@aws-0-eu-central-1.pooler.supabase.com:5432/postgres
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout Wallet Ownership test ref
        uses: actions/checkout@v5
        with:
          ref: test/pay-wallet-ownership-e2e-on-114

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PAY_E2E_OTHER_MERCHANT_ID"
          test -n "$SUPABASE_DB_URL"
          test -n "$SUPABASE_DB_PASSWORD"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run authenticated Wallet Ownership lifecycle E2E
        run: bunx tsx e2e/pay-wallet-ownership-lifecycle.e2e.ts
