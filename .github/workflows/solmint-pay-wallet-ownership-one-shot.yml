name: SolMint Pay Wallet Ownership One Shot
# test harness follows canonical production session-pooler configuration
# management api fixture path v2

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  wallet-ownership-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOLMINT_PAY_PRODUCTION_ORIGIN: https://solmint.ir
      PAY_E2E_OTHER_MERCHANT_ID: ${{ secrets.PAY_E2E_OTHER_MERCHANT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout Wallet Ownership test ref
        uses: actions/checkout@v5
        with:
          ref: test/pay-wallet-ownership-e2e-on-114

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Probe Supabase Management API database access
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          node --input-type=module <<'NODE'
          const token = process.env.SUPABASE_ACCESS_TOKEN;
          const response = await fetch('https://api.supabase.com/v1/projects/nvopkbiedorfshwbmyhn/database/query', {
            method: 'POST',
            headers: { authorization: 'Bearer ' + token, 'content-type': 'application/json' },
            body: JSON.stringify({ query: 'select 1 as ok', read_only: true }),
          });
          if (!response.ok) throw new Error('Supabase Management API database query failed with HTTP ' + response.status + '.');
          console.log('Supabase Management API database access: PASS');
          NODE
      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PAY_E2E_OTHER_MERCHANT_ID"
          test -n "$SUPABASE_ACCESS_TOKEN"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run authenticated Wallet Ownership lifecycle E2E
        run: bunx tsx e2e/pay-wallet-ownership-lifecycle.e2e.ts
