name: Run semantic article rendering migration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply migration
        run: python3 scripts/apply-semantic-markdown-seo.py

      - name: Validate build
        run: npm install && npm run lint && npm run build

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/markdownRenderer.ts src/components/BlogHub.tsx server.ts src/index.css
          git diff --cached --quiet && { echo "No changes to commit."; exit 0; }
          git commit -m "fix: render article markdown as semantic HTML for SEO"
          git push origin HEAD:main
