name: SolMint Pay — Normalize Audit Release (temporary)

on:
  pull_request_target:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: solmint-pay-normalize-audit-release
  cancel-in-progress: false

jobs:
  normalize:
    if: github.event.pull_request.number == 37 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audited branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Normalize final migration counts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
            '.github/workflows/solmint-pay-release-evidence.yml': [
              ("PAY_MIGRATION_COUNT: '52'", "PAY_MIGRATION_COUNT: '54'"),
              ("ACTIVE_SQL_COUNT: '53'", "ACTIVE_SQL_COUNT: '55'"),
              ('test "${#expected[@]}" -eq 52', 'test "${#expected[@]}" -eq 54'),
              ('test "${#proposed[@]}" -eq 52', 'test "${#proposed[@]}" -eq 54'),
              ("= '53'", "= '55'"),
              ("= '52'", "= '54'"),
            ],
            '.github/workflows/solmint-pay-baseline-materialize.yml': [
              ("PAY_MIGRATION_COUNT: '52'", "PAY_MIGRATION_COUNT: '54'"),
              ("CANONICAL_ACTIVE_SQL_COUNT: '53'", "CANONICAL_ACTIVE_SQL_COUNT: '55'"),
            ],
            '.github/workflows/solmint-pay-baseline-migration-replay.yml': [
              ("PAY_MIGRATION_COUNT: '51'", "PAY_MIGRATION_COUNT: '54'"),
            ],
            '.github/workflows/solmint-pay-migration-history-reconciliation-rehearsal.yml': [
              ("PAY_MIGRATION_COUNT: '52'", "PAY_MIGRATION_COUNT: '54'"),
              ("test \"$count\" = '53'", "test \"$count\" = '55'"),
            ],
            '.github/workflows/solmint-pay-baseline-definition-audit.yml': [
              ("PAY_MIGRATION_COUNT: '52'", "PAY_MIGRATION_COUNT: '54'"),
            ],
            'scripts/solmint-pay/rehearse-migration-history-reconciliation.mjs': [
              ('expectedPayCount = 52', 'expectedPayCount = 54'),
              ('exactly 52 Pay migration versions', 'exactly 54 Pay migration versions'),
            ],
          }
          for name, pairs in replacements.items():
              p=Path(name); s=p.read_text()
              for old,new in pairs:
                  if old not in s: raise SystemExit(f'missing pattern: {name}: {old}')
                  s=s.replace(old,new)
              p.write_text(s)
          PY
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*_solmint_pay_*.sql' | wc -l)" -eq 54
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 55
      - name: Commit normalized release state to audited branch
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows scripts/solmint-pay/rehearse-migration-history-reconciliation.mjs
          git commit -m 'chore(pay): align release evidence with 54 Pay migrations'
          git push origin HEAD:audit/solmint-pay-next
