name: Pay hosted checkout patch

on:
  push:
    branches: [feat/pay-payment-link-hosted-checkout]

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Inspect checkout verification anchors
        run: |
          grep -n -E "const .*verify|verifyPayment|verificationState|signature" src/pay/PayCheckout.tsx | head -80
          sed -n '150,290p' src/pay/PayCheckout.tsx
