name: SolMint VNext Squads SDK tests

on:
  push:
    branches:
      - feat/pay-subscription-billing
    paths:
      - .github/workflows/solmint-vnext-squads-sdk.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solmint-vnext-squads-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staged-proposal-helper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact VNext fork source
        uses: actions/checkout@v5
        with:
          repository: azad2022/solmint-subscriptions-program
          ref: 6c733b9bd582387709f08faaa4757216ab76585c
          path: vnext-source
          persist-credentials: false

      - name: Verify exact fork commit
        working-directory: vnext-source
        run: |
          actual="$(git rev-parse HEAD)"
          expected="6c733b9bd582387709f08faaa4757216ab76585c"
          printf 'EXPECTED_VNEXT_SHA=%s\\nACTUAL_VNEXT_SHA=%s\\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Activate the repository-pinned pnpm version
        working-directory: vnext-source
        run: |
          corepack enable
          corepack prepare pnpm@11.13.0 --activate
          node --version
          pnpm --version

      - name: Install only the TypeScript SDK workspace and its dependencies
        working-directory: vnext-source
        run: pnpm install --frozen-lockfile --filter @solana/subscriptions...

      - name: Run staged Squads proposal helper tests
        working-directory: vnext-source
        run: pnpm --filter @solana/subscriptions exec vitest run --config vitest.config.ts test/smart-wallets/squadsWallet.test.ts
