name: SolMint Pay Devnet E2E

on:
  workflow_dispatch:
    inputs:
      run:
        description: 'Run the funded real-transaction Devnet E2E'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
  pull_request:
    paths:
      - 'src/pay/**'
      - 'functions/api/pay/**'
      - 'e2e/pay-devnet-native.e2e.ts'
      - 'e2e/pay-payment-intent-devnet-lifecycle.e2e.ts'
      - 'package.json'
      - '.github/workflows/solmint-pay-devnet-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'src/pay/**'
      - 'functions/api/pay/**'
      - 'e2e/pay-devnet-native.e2e.ts'
      - 'e2e/pay-payment-intent-devnet-lifecycle.e2e.ts'
      - 'package.json'
      - '.github/workflows/solmint-pay-devnet-e2e.yml'

permissions:
  contents: read

concurrency:
  group: pay-devnet-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  devnet-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Pay E2E runs in CI only. Keep the Solana SDK out of the production dependency graph.
      - name: Install pinned Solana E2E SDK
        run: bun add --no-save @solana/web3.js@1.99.0

      - name: Require dedicated Devnet RPC
        env:
          SOLANA_DEVNET_RPC_URL: ${{ secrets.SOLANA_DEVNET_RPC_URL }}
        run: |
          if [ -z "$SOLANA_DEVNET_RPC_URL" ]; then
            echo "SOLANA_DEVNET_RPC_URL GitHub Actions secret is required for funded Devnet E2E."
            exit 1
          fi
          case "$SOLANA_DEVNET_RPC_URL" in
            https://*) ;;
            *) echo "SOLANA_DEVNET_RPC_URL must use HTTPS"; exit 1 ;;
          esac

      - name: Require existing Devnet CI funding wallet
        env:
          DEVNET_E2E_FUNDER_SECRET_KEY_B64: ${{ secrets.DEVNET_E2E_FUNDER_SECRET_KEY_B64 }}
        run: |
          if [ -z "$DEVNET_E2E_FUNDER_SECRET_KEY_B64" ]; then
            echo "DEVNET_E2E_FUNDER_SECRET_KEY_B64 GitHub Actions secret is required for funded Devnet E2E."
            exit 1
          fi

      - name: Top up Devnet E2E funder from official faucet when needed
        env:
          SOLANA_DEVNET_RPC_URL: \${{ secrets.SOLANA_DEVNET_RPC_URL }}
          DEVNET_E2E_FUNDER_SECRET_KEY_B64: \${{ secrets.DEVNET_E2E_FUNDER_SECRET_KEY_B64 }}
        run: |
          node --input-type=module <<'NODE'
          import { Keypair, Connection, PublicKey } from '@solana/web3.js';
          const secret = process.env.DEVNET_E2E_FUNDER_SECRET_KEY_B64?.trim();
          if (!secret) throw new Error('DEVNET_E2E_FUNDER_SECRET_KEY_B64 is required.');
          const ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
          const INDEX = new Map([...ALPHABET].map((char, index) => [char, index]));
          function decodeBase58(value) {
            let n = 0n;
            for (const char of value) { const index = INDEX.get(char); if (index === undefined) throw new Error('Invalid Base58 funder secret.'); n = n * 58n + BigInt(index); }
            let hex = n.toString(16); if (hex.length % 2) hex = '0' + hex;
            const body = hex ? Buffer.from(hex, 'hex') : Buffer.alloc(0);
            let zeros = 0; for (const char of value) { if (char !== '1') break; zeros += 1; }
            return Buffer.concat([Buffer.alloc(zeros), body]);
          }
          const candidates = [];
          const base64 = Buffer.from(secret, 'base64');
          if (base64.length === 64) candidates.push(base64);
          try { const base58 = decodeBase58(secret); if (base58.length === 64) candidates.push(base58); } catch {}
          let funder = null;
          for (const candidate of candidates) { try { const keypair = Keypair.fromSecretKey(candidate); if (Buffer.from(candidate.subarray(32)).equals(Buffer.from(keypair.publicKey.toBytes()))) { funder = keypair; break; } } catch {} }
          if (!funder) throw new Error('DEVNET_E2E_FUNDER_SECRET_KEY_B64 is not a valid Solana keypair.');
          const expected = 'EZTvPLYyjn6TnXqhiFKw59aqgAPHwxV4qUwhHXctNbXV';
          if (funder.publicKey.toBase58() !== expected) throw new Error('Devnet funder secret does not match the documented CI funder.');
          const reserve = 1_100_000_000;
          const before = await new Connection(process.env.SOLANA_DEVNET_RPC_URL, { commitment: 'confirmed' }).getBalance(new PublicKey(expected), 'confirmed');
          console.log('Devnet funder balance before faucet check: ' + (before / 1e9).toFixed(6) + ' SOL');
          if (before >= reserve) { console.log('Devnet funder reserve is sufficient.'); process.exit(0); }
          const faucet = new Connection('https://api.devnet.solana.com', { commitment: 'confirmed' });
          const signature = await faucet.requestAirdrop(new PublicKey(expected), 2_000_000_000);
          const latest = await faucet.getLatestBlockhash('confirmed');
          const confirmation = await faucet.confirmTransaction({ signature, blockhash: latest.blockhash, lastValidBlockHeight: latest.lastValidBlockHeight }, 'confirmed');
          if (confirmation.value.err) throw new Error('Official Devnet faucet airdrop transaction failed.');
          const after = await new Connection(process.env.SOLANA_DEVNET_RPC_URL, { commitment: 'confirmed' }).getBalance(new PublicKey(expected), 'confirmed');
          console.log('Devnet funder balance after faucet check: ' + (after / 1e9).toFixed(6) + ' SOL');
          if (after < reserve) throw new Error('Devnet funder reserve remains insufficient after official faucet top-up.');
          console.log('Devnet funder self-healing top-up: PASS');
          NODE
      - name: Run real Devnet payment verification E2E
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_DEVNET_RPC_URL }}
          DEVNET_E2E_FUNDER_SECRET_KEY_B64: ${{ secrets.DEVNET_E2E_FUNDER_SECRET_KEY_B64 }}
        run: bun run test:pay:devnet

      - name: Run real Devnet Payment Intent reconciliation E2E
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_DEVNET_RPC_URL }}
          DEVNET_E2E_FUNDER_SECRET_KEY_B64: ${{ secrets.DEVNET_E2E_FUNDER_SECRET_KEY_B64 }}
        run: bun run test:e2e:pay-devnet-payment-intent
