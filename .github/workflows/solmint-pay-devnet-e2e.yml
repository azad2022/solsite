name: SolMint Pay Devnet E2E

on:
  workflow_dispatch:
    inputs:
      run:
        description: 'Run the funded real-transaction Devnet E2E'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
  pull_request:
    paths:
      - 'functions/api/pay/**'
      - 'src/pay/services/**'
      - 'src/pay/PayCheckout.tsx'
      - 'src/pay/PayApp.tsx'
      - 'src/pay/components/PayPublicPaymentLink.tsx'
      - 'src/pay/components/PayPaymentReceipt.tsx'
      - 'src/pay/payment-receipt-service.ts'
      - 'src/pay/solana-wallet-provider.ts'
      - 'src/pay/payment-verification-service.ts'
      - 'src/pay/payment-intent-service.ts'
      - 'src/pay/checkout-status.ts'
      - 'e2e/pay-devnet-native.e2e.ts'
      - 'e2e/pay-payment-intent-devnet-lifecycle.e2e.ts'
      - 'e2e/pay-transaction-request-devnet.e2e.ts'
      - 'e2e/pay-bulk-payout-devnet.e2e.ts'
      - 'supabase/migrations/**'
      - 'src/pay/components/PayBulkPay.tsx'
      - 'src/pay/components/pay-bulk-i18n.ts'
      - 'src/pay/components/pay-bulk.css'
      - 'package.json'
      - 'bun.lock'
  push:
    branches: [main]
    paths:
      - 'src/pay/**'
      - 'functions/api/pay/**'
      - 'e2e/pay-devnet-native.e2e.ts'
      - 'e2e/pay-payment-intent-devnet-lifecycle.e2e.ts'
      - 'e2e/pay-bulk-payout-devnet.e2e.ts'
      - 'functions/api/pay/**'
      - 'supabase/migrations/**'
      - 'package.json'
      - '.github/workflows/solmint-pay-devnet-e2e.yml'

permissions:
  contents: read

concurrency:
  group: pay-devnet-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.bypass.outputs.run || steps.reuse.outputs.run }}
    steps:
      - name: Checkout exact PR head and full history
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - id: bypass
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        shell: bash
        run: echo "run=true" >> "$GITHUB_OUTPUT"

      - id: reuse
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/pr-job-scope
        with:
          workflow-id: '346641662'
          job-name: 'devnet-e2e'
          job-id: 'devnet-e2e'
          workflow-file: '.github/workflows/solmint-pay-devnet-e2e.yml'
          path-patterns: '["functions/api/pay/**","src/pay/**","e2e/pay-devnet-native.e2e.ts","e2e/pay-payment-intent-devnet-lifecycle.e2e.ts","e2e/pay-transaction-request-devnet.e2e.ts","e2e/pay-bulk-payout-devnet.e2e.ts","supabase/migrations/**","package.json","bun.lock"]'
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          head-ref: ${{ github.head_ref }}
          pr-number: ${{ github.event.pull_request.number }}
          repository: ${{ github.repository }}

  devnet-e2e:
    needs: scope
    if: needs.scope.outputs.run == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run == 'true')
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Require dedicated Devnet RPC
        env:
          SOLANA_DEVNET_RPC_URL: ${{ secrets.SOLANA_DEVNET_RPC_URL }}
        run: |
          if [ -z "$SOLANA_DEVNET_RPC_URL" ]; then
            echo "SOLANA_DEVNET_RPC_URL GitHub Actions secret is required for funded Devnet E2E."
            exit 1
          fi
          case "$SOLANA_DEVNET_RPC_URL" in
            https://*) ;;
            *) echo "SOLANA_DEVNET_RPC_URL must use HTTPS"; exit 1 ;;
          esac

      - name: Require existing Devnet CI funding wallet
        env:
          DEVNET_E2E_FUNDER_SECRET_KEY_B64: ${{ secrets.DEVNET_E2E_FUNDER_SECRET_KEY_B64 }}
        run: |
          if [ -z "$DEVNET_E2E_FUNDER_SECRET_KEY_B64" ]; then
            echo "DEVNET_E2E_FUNDER_SECRET_KEY_B64 GitHub Actions secret is required for funded Devnet E2E."
            exit 1
          fi

      - name: Reset shared real-payment fixture
        env:
          DEVNET_PAYMENT_FIXTURE_PATH: /tmp/solmint-pay-devnet-fixture.json
        run: rm -f "$DEVNET_PAYMENT_FIXTURE_PATH"

      - name: Run real Devnet payment verification E2E
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_DEVNET_RPC_URL }}
          DEVNET_E2E_FUNDER_SECRET_KEY_B64: ${{ secrets.DEVNET_E2E_FUNDER_SECRET_KEY_B64 }}
          DEVNET_PAYMENT_FIXTURE_PATH: /tmp/solmint-pay-devnet-fixture.json
        run: bun run test:pay:devnet

      - name: Run hosted transaction builder Devnet E2E
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_DEVNET_RPC_URL }}
          DEVNET_E2E_FUNDER_SECRET_KEY_B64: ${{ secrets.DEVNET_E2E_FUNDER_SECRET_KEY_B64 }}
        run: bun run test:e2e:pay-transaction-request-devnet

      - name: Run real Devnet Bulk Pay transaction E2E
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_DEVNET_RPC_URL }}
          DEVNET_E2E_FUNDER_SECRET_KEY_B64: ${{ secrets.DEVNET_E2E_FUNDER_SECRET_KEY_B64 }}
        run: bun run test:e2e:pay-bulk-payout-devnet

      - name: Run real Devnet Payment Intent reconciliation E2E
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_DEVNET_RPC_URL }}
          DEVNET_PAYMENT_FIXTURE_PATH: /tmp/solmint-pay-devnet-fixture.json
        run: bun run test:e2e:pay-devnet-payment-intent
