name: SolMint Pay Devnet E2E

on:
  workflow_dispatch:
    inputs:
      run:
        description: 'Run the funded real-transaction Devnet E2E'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
  pull_request:
    paths:
      - 'src/pay/**'
      - 'functions/api/pay/**'
      - 'e2e/pay-devnet-native.e2e.ts'
      - 'package.json'
      - '.github/workflows/solmint-pay-devnet-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'src/pay/**'
      - 'functions/api/pay/**'
      - 'e2e/pay-devnet-native.e2e.ts'
      - 'package.json'
      - '.github/workflows/solmint-pay-devnet-e2e.yml'

permissions:
  contents: read

concurrency:
  group: pay-devnet-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  devnet-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Require dedicated Devnet RPC
        env:
          SOLANA_DEVNET_RPC_URL: ${{ secrets.SOLANA_DEVNET_RPC_URL }}
        run: |
          if [ -z "$SOLANA_DEVNET_RPC_URL" ]; then
            echo "SOLANA_DEVNET_RPC_URL GitHub Actions secret is required for funded Devnet E2E."
            exit 1
          fi
          case "$SOLANA_DEVNET_RPC_URL" in
            https://*) ;;
            *) echo "SOLANA_DEVNET_RPC_URL must use HTTPS"; exit 1 ;;
          esac

      - name: Run real Devnet payment verification E2E
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_DEVNET_RPC_URL }}
        run: bun run test:pay:devnet
