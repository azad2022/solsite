name: Pay lock refresh PR

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - package.json
      - bun.lock
      - .github/workflows/pay-lock-refresh-pr.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - run: bun install --lockfile-only
      - run: git config user.name 'github-actions[bot]'
      - run: git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - run: git add bun.lock && git diff --cached --quiet || git commit -m 'chore(pay): synchronize bun lockfile'
      - run: git push origin HEAD:${{ github.event.pull_request.head.ref }}
