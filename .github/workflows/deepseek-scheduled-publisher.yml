name: Solmint DeepSeek Scheduled Publisher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check production schedule and publish only when due
        env:
          SITE_URL: https://solmint.ir
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          site = os.environ['SITE_URL'].rstrip('/')
          settings_url = site + '/api/cms/settings'
          publish_url = site + '/api/deepseek/auto-publish'

          def curl_json(url, method='GET'):
              args = ['curl', '--silent', '--show-error', '--location', '--max-time', '30', '--retry', '2', '--retry-delay', '2']
              if method == 'POST':
                  args += ['--request', 'POST', '--header', 'Content-Type: application/json', '--data', '{}']
              args += [url]
              raw = subprocess.check_output(args, text=True)
              return json.loads(raw)

          data = curl_json(settings_url)
          ds = (data or {}).get('settings', {}).get('deepseek', {})
          schedule = ds.get('publishSchedule') or {}

          enabled = bool(ds.get('autoPublishEnabled') or schedule.get('enabled'))
          if not enabled:
              print('[scheduler] Auto publishing is disabled.')
              raise SystemExit(0)

          tz = ZoneInfo('Asia/Tehran')
          now = datetime.now(tz)

          weekday_names = ['دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنج‌شنبه', 'جمعه', 'شنبه', 'یکشنبه']
          current_day = weekday_names[now.weekday()].replace('\u200c', '').replace(' ', '')
          configured_days = schedule.get('publishDays') or []
          configured_days = [str(x).replace('\u200c', '').replace(' ', '').replace('_', '') for x in configured_days]
          all_days = not configured_days or any(x in {'همهروزها', 'همهروز', 'هرروز', 'همه', 'all'} for x in configured_days)
          if not all_days and current_day not in configured_days:
              print(f'[scheduler] Today ({current_day}) is not enabled for publishing.')
              raise SystemExit(0)

          interval_hours = float(schedule.get('intervalHours') or ds.get('publishScheduleHours') or 6)
          interval_hours = max(interval_hours, 1.0)

          last_raw = ds.get('lastAutoPublishedAt')
          last_dt = None
          if last_raw:
              try:
                  last_dt = datetime.fromisoformat(str(last_raw).replace('Z', '+00:00')).astimezone(tz)
              except Exception:
                  last_dt = None

          hours_passed = 999.0 if last_dt is None else (now - last_dt).total_seconds() / 3600

          publish_time = str(schedule.get('publishTime') or '10:00').strip()
          try:
              hh, mm = [int(x) for x in publish_time.split(':', 1)]
          except Exception:
              hh, mm = 10, 0

          scheduled_due = (now.hour * 60 + now.minute) >= (hh * 60 + mm)
          last_slot = ds.get('lastPublishedSlot') or ''
          fixed_slot = f"slot_{now:%Y-%m-%d}_{publish_time}"

          fixed_due = scheduled_due and last_slot != fixed_slot
          interval_due = hours_passed >= interval_hours

          print(f'[scheduler] now={now.isoformat()} last={last_raw!r} hours_passed={hours_passed:.2f} interval={interval_hours} fixed_due={fixed_due} interval_due={interval_due}')

          if not (fixed_due or interval_due):
              print('[scheduler] Publication is not due yet.')
              raise SystemExit(0)

          print('[scheduler] Publication is due; calling production DeepSeek auto-publish endpoint.')
          result = curl_json(publish_url, method='POST')
          print(json.dumps(result, ensure_ascii=False, indent=2))

          if not result.get('success'):
              raise SystemExit('DeepSeek auto-publish returned success=false')
          PY
