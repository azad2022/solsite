name: Solmint DeepSeek Scheduled Publisher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Trigger production DeepSeek scheduler
        env:
          SITE_URL: https://solmint.ir
          CRON_SECRET: ${{ secrets.AUTOPUBLISH_CRON_SECRET }}
        run: |
          set -euo pipefail

          # The scheduler is intentionally a no-op until the production secret is configured.
          # This prevents GitHub from generating repeated failure emails while keeping the
          # workflow ready to activate once AUTOPUBLISH_CRON_SECRET is added.
          if [ -z "${CRON_SECRET}" ]; then
            echo "AUTOPUBLISH_CRON_SECRET is not configured; scheduled publishing is currently disabled."
            exit 0
          fi

          url="${SITE_URL%/}/api/deepseek/auto-publish/scheduled"
          response_file="$(mktemp)"

          http_code="$(curl --silent --show-error --location \
            --max-time 150 \
            --retry 2 \
            --retry-delay 3 \
            --retry-all-errors \
            --header 'Content-Type: application/json' \
            --header "x-autopublish-cron-secret: ${CRON_SECRET}" \
            --data '{}' \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            "${url}")"

          echo "HTTP ${http_code}"
          cat "${response_file}"
          echo

          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "Scheduled publisher endpoint failed." >&2
            exit 1
          fi
