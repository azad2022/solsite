name: Solmint DeepSeek Scheduled Publisher

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # One-time production migration. The previous migration workflow patched
      # server.ts in the runner but failed before committing because this repo
      # intentionally has no package-lock.json and therefore cannot use npm ci.
      - name: Persist DeepSeek production cron endpoint
        shell: python
        run: |
          from pathlib import Path

          path = Path('server.ts')
          text = path.read_text(encoding='utf-8')
          changed = False

          if 'const requireAutoPublishCronAuth' not in text:
              marker = '''  const requireAdminAuth = (req: express.Request, res: express.Response, next: express.NextFunction) => {\n    if (!isAuthorizedAdmin(req)) {\n      return res.status(401).json({\n        success: false,\n        message: "دسترسی غیرمجاز. برای انجام این عملیات باید به عنوان مدیر سیستم احراز هویت شده باشید."\n      });\n    }\n    next();\n  };\n'''
              addition = marker + '''\n  // Dedicated production cron authentication. This endpoint never accepts the public admin UI passcode.\n  const requireAutoPublishCronAuth = (req: express.Request, res: express.Response, next: express.NextFunction) => {\n    const configuredSecret = String(process.env.AUTOPUBLISH_CRON_SECRET || '').trim();\n    const suppliedSecret = String(req.headers['x-autopublish-cron-secret'] || '').trim();\n\n    if (!configuredSecret || !suppliedSecret || suppliedSecret !== configuredSecret) {\n      return res.status(401).json({\n        success: false,\n        code: 'AUTOPUBLISH_CRON_UNAUTHORIZED',\n        message: 'احراز هویت سرویس زمان‌بندی انتشار خودکار نامعتبر است.'\n      });\n    }\n\n    next();\n  };\n'''
              if marker not in text:
                  raise SystemExit('Admin auth marker was not found; refusing to patch server.ts')
              text = text.replace(marker, addition, 1)
              changed = True

          route_marker = '''  // API endpoint for triggering Server-Side Auto-Publishing\n  app.post("/api/deepseek/auto-publish", rateLimitMiddleware(15, 60000), async (req, res) => {\n'''
          scheduled_route = '''  // Production cron endpoint: wake the scheduler without bypassing its due-time/idempotency checks.\n  app.post("/api/deepseek/auto-publish/scheduled", requireAutoPublishCronAuth, rateLimitMiddleware(30, 60000), async (req, res) => {\n    try {\n      await checkScheduledPublishing();\n      const latest = getCmsSettings().deepseek;\n      return res.json({\n        success: true,\n        status: latest?.lastExecutionStatus || 'idle',\n        message: latest?.lastExecutionMessage || 'بررسی زمان‌بندی انجام شد؛ در صورت رسیدن زمان انتشار، فرآیند اجرا خواهد شد.'\n      });\n    } catch (err: any) {\n      const message = err?.message || 'خطا در بررسی زمان‌بندی انتشار خودکار.';\n      console.error('[DeepSeek AutoPublish Cron] Scheduler error:', err);\n      return res.status(500).json({ success: false, code: 'AUTOPUBLISH_SCHEDULER_ERROR', message });\n    }\n  });\n\n'''
          if '"/api/deepseek/auto-publish/scheduled"' not in text:
              if route_marker not in text:
                  raise SystemExit('Auto-publish endpoint marker was not found; refusing to patch server.ts')
              text = text.replace(route_marker, scheduled_route + route_marker, 1)
              changed = True

          if changed:
              path.write_text(text, encoding='utf-8')
              print('server.ts patched successfully')
          else:
              print('server.ts already contains the production cron patch')

      - name: Validate production patch
        shell: bash
        run: |
          set -euo pipefail
          test -f server.ts
          grep -q "const requireAutoPublishCronAuth" server.ts
          grep -q '/api/deepseek/auto-publish/scheduled' server.ts
          grep -q 'checkScheduledPublishing()' server.ts
          echo 'Production DeepSeek scheduler patch validation passed.'

      - name: Commit production patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- server.ts; then
            echo 'No server.ts changes to commit.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add server.ts
            git commit -m 'fix: harden DeepSeek scheduled publishing trigger'
            git push origin HEAD:main
          fi

      - name: Check production schedule and publish only when due
        env:
          SITE_URL: https://solmint.ir
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime
          from zoneinfo import ZoneInfo

          site = os.environ['SITE_URL'].rstrip('/')
          settings_url = site + '/api/cms/settings'
          publish_url = site + '/api/deepseek/auto-publish'

          def curl_json(url, method='GET'):
              args = ['curl', '--silent', '--show-error', '--location', '--max-time', '30', '--retry', '2', '--retry-delay', '2']
              if method == 'POST':
                  args += ['--request', 'POST', '--header', 'Content-Type: application/json', '--data', '{}']
              args += [url]
              raw = subprocess.check_output(args, text=True)
              return json.loads(raw)

          data = curl_json(settings_url)
          ds = (data or {}).get('settings', {}).get('deepseek', {})
          schedule = ds.get('publishSchedule') or {}

          enabled = bool(ds.get('autoPublishEnabled') or schedule.get('enabled'))
          if not enabled:
              print('[scheduler] Auto publishing is disabled.')
              raise SystemExit(0)

          tz = ZoneInfo('Asia/Tehran')
          now = datetime.now(tz)

          weekday_names = ['دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنج‌شنبه', 'جمعه', 'شنبه', 'یکشنبه']
          current_day = weekday_names[now.weekday()].replace('\u200c', '').replace(' ', '')
          configured_days = schedule.get('publishDays') or []
          configured_days = [str(x).replace('\u200c', '').replace(' ', '').replace('_', '') for x in configured_days]
          all_days = not configured_days or any(x in {'همهروزها', 'همهروز', 'هرروز', 'همه', 'all'} for x in configured_days)
          if not all_days and current_day not in configured_days:
              print(f'[scheduler] Today ({current_day}) is not enabled for publishing.')
              raise SystemExit(0)

          interval_value = schedule.get('intervalHours') or ds.get('publishScheduleHours')
          interval_hours = float(interval_value) if interval_value else 0.0
          interval_hours = max(interval_hours, 1.0) if interval_hours else 0.0

          last_raw = ds.get('lastAutoPublishedAt')
          last_dt = None
          if last_raw:
              try:
                  last_dt = datetime.fromisoformat(str(last_raw).replace('Z', '+00:00')).astimezone(tz)
              except Exception:
                  last_dt = None

          hours_passed = 999.0 if last_dt is None else (now - last_dt).total_seconds() / 3600

          if interval_hours:
              due = hours_passed >= interval_hours
              print(f'[scheduler] mode=interval now={now.isoformat()} last={last_raw!r} hours_passed={hours_passed:.2f} interval={interval_hours} due={due}')
          else:
              publish_time = str(schedule.get('publishTime') or '10:00').strip()
              try:
                  hh, mm = [int(x) for x in publish_time.split(':', 1)]
              except Exception:
                  hh, mm = 10, 0
              today_slot = f"slot_{now:%Y-%m-%d}_{publish_time}"
              due = (now.hour * 60 + now.minute) >= (hh * 60 + mm) and ds.get('lastPublishedSlot') != today_slot
              print(f'[scheduler] mode=daily now={now.isoformat()} last={last_raw!r} publish_time={publish_time} due={due}')

          if not due:
              print('[scheduler] Publication is not due yet.')
              raise SystemExit(0)

          print('[scheduler] Publication is due; calling production DeepSeek auto-publish endpoint.')
          result = curl_json(publish_url, method='POST')
          print(json.dumps(result, ensure_ascii=False, indent=2))

          if not result.get('success'):
              raise SystemExit('DeepSeek auto-publish returned success=false')
          PY
