name: SolMint Pay — Release Evidence Gate

# Release evidence only. Production is never a target of this workflow.
# Every assertion is evaluated against the exact commit that triggered the run.
# Current-head audit marker: 2026-09-05 provenance rerun.
on:
  push:
    branches: ['audit/solmint-pay-next']
    paths:
      - '.github/workflows/solmint-pay-release-evidence.yml'
      - 'supabase/**'
      - 'src/pay/**'
      - 'tests/e2e/**'
      - 'tsconfig.e2e.json'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/solmint-pay-release-evidence.yml'
      - 'supabase/**'
      - 'src/pay/**'
      - 'tests/e2e/**'
      - 'tsconfig.e2e.json'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solmint-pay-release-evidence
  cancel-in-progress: false

env:
  PAY_MIGRATION_COUNT: '52'
  ACTIVE_SQL_COUNT: '53'
  PRODUCTION_MIGRATION_COUNT: '56'
  BASELINE_VERSION: '20260829090000'
  SOLANA_DEVNET_RPC_URL: 'https://api.devnet.solana.com'
  SUPABASE_CLI_VERSION: '2.116.0'

jobs:
  quality:
    name: Quality / typecheck / build / unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact audited commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prove checkout provenance
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.15'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Unit tests
        run: bun test tests/**/*.test.ts

  database:
    name: Database security and replayability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact audited commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prove checkout provenance
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Prove Supabase CLI version
        run: test "$(supabase --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | tail -1)" = "$SUPABASE_CLI_VERSION"
      - name: Validate canonical migration layout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*_solmint_pay_*.sql' | wc -l)" -eq "$PAY_MIGRATION_COUNT"
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq "$ACTIVE_SQL_COUNT"
          test -f "supabase/migrations/${BASELINE_VERSION}_solmint_production_baseline.sql"
      - name: Prepare isolated Supabase project
        shell: bash
        run: |
          set -Eeuo pipefail
          PAY_DB_DIR="$RUNNER_TEMP/solmint-pay-release-db"
          rm -rf "$PAY_DB_DIR"
          supabase init --workdir "$PAY_DB_DIR"
          mkdir -p "$PAY_DB_DIR/supabase/migrations" "$PAY_DB_DIR/supabase/tests/database"
          cat > "$PAY_DB_DIR/supabase/migrations/00000000000000_ci_pay_prerequisites.sql" <<'SQL'
          create extension if not exists pgcrypto;
          create table public.users (id text primary key);
          SQL
          find supabase/migrations -maxdepth 1 -type f -name '*_solmint_pay_*.sql' -print0 | xargs -0 -r -I{} cp "{}" "$PAY_DB_DIR/supabase/migrations/"
          find supabase/tests/database -maxdepth 1 -type f -name 'pay_*.sql' -print0 | xargs -0 -r -I{} cp "{}" "$PAY_DB_DIR/supabase/tests/database/"
          echo "PAY_DB_DIR=$PAY_DB_DIR" >> "$GITHUB_ENV"
      - name: Start isolated Supabase
        run: supabase --workdir "$PAY_DB_DIR" db start
      - name: Run database security tests
        run: supabase --workdir "$PAY_DB_DIR" test db
      - name: Prove clean migration replay
        run: supabase --workdir "$PAY_DB_DIR" db reset --local
      - name: Re-run database security tests after reset
        run: supabase --workdir "$PAY_DB_DIR" test db

  migration:
    name: Production-history reconciliation rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact audited commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prove checkout provenance
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Prove Supabase CLI version
        run: test "$(supabase --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | tail -1)" = "$SUPABASE_CLI_VERSION"
      - name: Start disposable PostgreSQL 17
        run: |
          set -Eeuo pipefail
          docker run -d --name solmint-pay-release-postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=postgres -p 5432:5432 postgres:17-alpine
          for i in $(seq 1 60); do docker exec solmint-pay-release-postgres pg_isready -U postgres -d postgres >/dev/null 2>&1 && break; sleep 2; done
          docker exec solmint-pay-release-postgres pg_isready -U postgres -d postgres
      - name: Prepare Supabase migration metadata and roles
        run: |
          set -Eeuo pipefail
          docker exec solmint-pay-release-postgres psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE SCHEMA IF NOT EXISTS extensions; CREATE SCHEMA IF NOT EXISTS supabase_migrations;"
          docker exec solmint-pay-release-postgres psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon NOLOGIN; END IF; IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF; IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='service_role') THEN CREATE ROLE service_role NOLOGIN; END IF; END \$\$;"
          docker exec solmint-pay-release-postgres psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE TABLE supabase_migrations.schema_migrations (version text PRIMARY KEY, name text NOT NULL);"
      - name: Replay canonical Production baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          baseline="supabase/migrations/${BASELINE_VERSION}_solmint_production_baseline.sql"
          node scripts/solmint-pay/baseline-validate.mjs "$baseline"
          sed -e '/^CREATE EXTENSION IF NOT EXISTS "pg_cron"/d' -e '/^CREATE EXTENSION IF NOT EXISTS "pg_net"/d' -e '/^CREATE EXTENSION IF NOT EXISTS "pg_stat_statements"/d' -e '/^CREATE EXTENSION IF NOT EXISTS "supabase_vault"/d' -e '/^COMMENT ON EXTENSION "pg_cron"/d' -e '/^COMMENT ON EXTENSION "pg_net"/d' -e '/^COMMENT ON EXTENSION "pg_stat_statements"/d' -e '/^COMMENT ON EXTENSION "supabase_vault"/d' "$baseline" > /tmp/baseline.sql
          docker cp /tmp/baseline.sql solmint-pay-release-postgres:/tmp/baseline.sql
          docker exec solmint-pay-release-postgres psql -v ON_ERROR_STOP=1 -U postgres -d postgres -f /tmp/baseline.sql > /tmp/baseline-replay.log 2>&1
      - name: Capture pre-repair semantic schema
        run: |
          set -Eeuo pipefail
          docker exec solmint-pay-release-postgres pg_dump --schema-only --no-owner --no-privileges --exclude-schema=supabase_migrations -U postgres -d postgres > /tmp/schema-before.sql
          sed -E '/^--/d; /^$/d; /^\\restrict .*/d; /^\\unrestrict .*/d' /tmp/schema-before.sql | sha256sum | awk '{print $1}' > /tmp/schema-before.sha256
      - name: Seed exact 56-entry Production history
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('scripts/solmint-pay/production-migration-history-manifest.json').read_text())
          assert len(m) == 56
          lines=['BEGIN;','TRUNCATE supabase_migrations.schema_migrations;']
          for row in m:
              lines.append("INSERT INTO supabase_migrations.schema_migrations(version,name) VALUES ('%s','%s');" % (row['version'].replace("'","''"), row['name'].replace("'","''")))
          lines.append('COMMIT;')
          Path('/tmp/seed.sql').write_text('\n'.join(lines)+'\n')
          PY
          docker cp /tmp/seed.sql solmint-pay-release-postgres:/tmp/seed.sql
          docker exec solmint-pay-release-postgres psql -v ON_ERROR_STOP=1 -U postgres -d postgres -f /tmp/seed.sql
          test "$(docker exec solmint-pay-release-postgres psql -At -U postgres -d postgres -c 'select count(*) from supabase_migrations.schema_migrations;')" = "$PRODUCTION_MIGRATION_COUNT"
      - name: Repair 56 history entries with real Supabase CLI
        run: |
          set -Eeuo pipefail
          db_url='postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable'
          mapfile -t versions < <(python3 - <<'PY'
          import json
          for row in json.load(open('scripts/solmint-pay/production-migration-history-manifest.json')): print(row['version'])
          PY
          )
          test "${#versions[@]}" -eq 56
          for version in "${versions[@]}"; do timeout 30s supabase migration repair "$version" --status reverted --db-url "$db_url"; done
          timeout 30s supabase migration repair "$BASELINE_VERSION" --status applied --db-url "$db_url"
      - name: Prove history repair caused zero schema drift
        run: |
          set -Eeuo pipefail
          docker exec solmint-pay-release-postgres pg_dump --schema-only --no-owner --no-privileges --exclude-schema=supabase_migrations -U postgres -d postgres > /tmp/schema-after.sql
          sed -E '/^--/d; /^$/d; /^\\restrict .*/d; /^\\unrestrict .*/d' /tmp/schema-after.sql | sha256sum | awk '{print $1}' > /tmp/schema-after.sha256
          test "$(cat /tmp/schema-before.sha256)" = "$(cat /tmp/schema-after.sha256)"
          test "$(docker exec solmint-pay-release-postgres psql -At -U postgres -d postgres -c 'select count(*) from supabase_migrations.schema_migrations;')" = '1'
          test "$(docker exec solmint-pay-release-postgres psql -At -U postgres -d postgres -c 'select version from supabase_migrations.schema_migrations;')" = "$BASELINE_VERSION"
      - name: Dry-run current canonical Pay chain
        run: |
          set -Eeuo pipefail
          db_url='postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable'
          set +e
          timeout 90s supabase db push --dry-run --db-url "$db_url" > /tmp/dry-run.txt 2>&1
          rc=$?
          set -e
          grep -F 'DRY RUN: migrations will *not* be pushed to the database.' /tmp/dry-run.txt
          grep -F 'Would push these migrations:' /tmp/dry-run.txt
          grep -F 'Finished supabase db push.' /tmp/dry-run.txt
          if grep -Eiq '(^|[^[:alnum:]_])(ERROR|FATAL|failed to|panic)([^[:alnum:]_]|$)' /tmp/dry-run.txt; then cat /tmp/dry-run.txt; exit 1; fi
          mapfile -t expected < <(find supabase/migrations -maxdepth 1 -type f -name '*_solmint_pay_*.sql' -printf '%f\n' | sort)
          mapfile -t proposed < <(sed -n 's/^ • //p' /tmp/dry-run.txt | grep -E '^([0-9]{14})_solmint_pay_.*\.sql$' | sort)
          test "${#expected[@]}" -eq 52
          test "${#proposed[@]}" -eq 52
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${proposed[@]}")
          if [ "$rc" -ne 0 ]; then echo "Validated dry-run returned rc=$rc; preview itself was complete and error-free."; fi
      - name: Apply canonical Pay chain to disposable PostgreSQL
        run: |
          set -Eeuo pipefail
          db_url='postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable'
          supabase db push --db-url "$db_url" --yes
          test "$(docker exec solmint-pay-release-postgres psql -At -U postgres -d postgres -c 'select count(*) from supabase_migrations.schema_migrations;')" = '53'
          test "$(docker exec solmint-pay-release-postgres psql -At -U postgres -d postgres -c "select count(*) from supabase_migrations.schema_migrations where version >= '20260830000000';")" = '52'
      - name: Cleanup disposable PostgreSQL
        if: always()
        run: docker rm -f solmint-pay-release-postgres >/dev/null 2>&1 || true

  devnet:
    name: Real Solana Devnet E2E verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact audited commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prove checkout provenance
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.15'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install test-only Solana dependency
        run: bun add --no-save @solana/web3.js@1.98.4
      - name: Typecheck E2E harness
        run: npx tsc -p tsconfig.e2e.json --noEmit
      - name: Validate dedicated Devnet funding secret
        env:
          DEVNET_FUNDER: ${{ secrets.DEVNET_E2E_FUNDER_SECRET_KEY_B64 }}
        run: test -n "${DEVNET_FUNDER:-}"
      - name: Generate ephemeral sender
        run: |
          set -Eeuo pipefail
          umask 077
          bun -e "const {Keypair}=require('@solana/web3.js'); require('fs').writeFileSync('/tmp/solmint-pay-devnet-keypair.json',JSON.stringify(Array.from(Keypair.generate().secretKey)))"
      - name: Fund ephemeral sender
        env:
          DEVNET_FUNDER: ${{ secrets.DEVNET_E2E_FUNDER_SECRET_KEY_B64 }}
        run: |
          set -Eeuo pipefail
          bun - <<'BUN'
          const {readFile}=require('node:fs/promises');
          const {Connection,Keypair,SystemProgram,Transaction,sendAndConfirmTransaction}=require('@solana/web3.js');
          const alpha='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
          const decode=(s)=>{if(!s||s.trim()!==s)throw Error('invalid Base58 funder secret');const a=[0];for(const c of s){const d=alpha.indexOf(c);if(d<0)throw Error('invalid Base58 funder secret');let carry=d;for(let i=0;i<a.length;i++){const n=a[i]*58+carry;a[i]=n&255;carry=Math.floor(n/256);}while(carry){a.push(carry&255);carry=Math.floor(carry/256);}}let z=0;while(z<s.length&&s[z]==='1')z++;const out=new Uint8Array(z+a.length-(a.length>1&&a[a.length-1]===0?1:0));for(let i=0;i<a.length;i++)out[out.length-1-i]=a[i];return out;};
          const raw=decode(process.env.DEVNET_FUNDER);if(raw.length!==64)throw Error(`funder secret must decode to 64 bytes, got ${raw.length}`);
          const senderRaw=JSON.parse(await readFile('/tmp/solmint-pay-devnet-keypair.json','utf8'));if(!Array.isArray(senderRaw)||senderRaw.length!==64)throw Error('invalid ephemeral sender keypair');const sender=Keypair.fromSecretKey(Uint8Array.from(senderRaw));const funder=Keypair.fromSecretKey(raw);const c=new Connection(process.env.SOLANA_DEVNET_RPC_URL,{commitment:'finalized',confirmTransactionInitialTimeout:45000});
          const balance=await c.getBalance(sender.publicKey,'finalized');if(balance<2000000){const {blockhash}=await c.getLatestBlockhash('finalized');const tx=new Transaction({recentBlockhash:blockhash,feePayer:funder.publicKey}).add(SystemProgram.transfer({fromPubkey:funder.publicKey,toPubkey:sender.publicKey,lamports:5000000}));const sig=await sendAndConfirmTransaction(c,tx,[funder],{commitment:'finalized'});console.log(`funding finalized: ${sig}`);}const after=await c.getBalance(sender.publicKey,'finalized');if(after<2000000)throw Error(`sender balance too low: ${after}`);console.log(`sender ${sender.publicKey.toBase58()} funded with ${after} lamports`);
          BUN
      - name: Run real payment verification E2E
        env:
          DEVNET_E2E_SENDER_KEYPAIR_PATH: /tmp/solmint-pay-devnet-keypair.json
        run: bun run tests/e2e/solmint-pay-devnet.e2e.ts
      - name: Remove ephemeral private key
        if: always()
        run: rm -f /tmp/solmint-pay-devnet-keypair.json
