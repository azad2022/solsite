name: Apply authentication repair

on:
  push:
    branches: [main, fix/server-auth-supabase-session]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[auth-repair-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply production authentication repair
        run: node scripts/repair-admin-auth.mjs

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/utils/serverDataStore.ts src/utils/cmsApiClient.ts scripts/repair-admin-auth.mjs
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "security: replace admin passcode auth with signed server sessions [auth-repair-applied]"
          git push
