name: SolMint Pay Wallet Ownership E2E Autonomous Runner

on:
  push:
    branches:
      - main
    paths:
      - .github/solmint-pay-wallet-ownership-e2e.trigger

permissions:
  actions: write
  contents: read

concurrency:
  group: solmint-pay-wallet-ownership-e2e-autonomous
  cancel-in-progress: false

jobs:
  dispatch-and-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Dispatch Wallet Ownership E2E
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run solmint-pay-wallet-ownership-e2e-manual.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f test_ref=test/pay-wallet-ownership-e2e-on-114
          echo "Wallet Ownership E2E dispatch submitted."

      - name: Resolve dispatched run
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            run_id="$(
              gh run list \
                --repo "${{ github.repository }}" \
                --workflow solmint-pay-wallet-ownership-e2e-manual.yml \
                --event workflow_dispatch \
                --limit 10 \
                --json databaseId,createdAt \
                --jq 'sort_by(.createdAt) | last | .databaseId'
            )"
            if [ -n "${run_id:-}" ] && [ "$run_id" != "null" ]; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done
          echo "Could not resolve the dispatched Wallet Ownership E2E run." >&2
          exit 1

      - name: Watch dispatched run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run watch "${{ steps.resolve.outputs.run_id }}" \
            --repo "${{ github.repository }}" \
            --exit-status
