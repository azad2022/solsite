name: SolMint Pay Wallet Ownership E2E Autonomous Runner

on:
  push:
    branches:
      - main
    paths:
      - .github/solmint-pay-wallet-ownership-e2e.trigger

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: solmint-pay-wallet-ownership-e2e-autonomous
  cancel-in-progress: false

jobs:
  wallet-ownership-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Wallet Ownership test ref
        uses: actions/checkout@v5
        with:
          ref: test/pay-wallet-ownership-e2e-on-114
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Validate required controlled configuration
        env:
          PAY_E2E_OTHER_MERCHANT_ID: ${{ secrets.PAY_E2E_OTHER_MERCHANT_ID }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PAY_E2E_OTHER_MERCHANT_ID"
          test -n "$SUPABASE_DB_URL"
          test -n "$SUPABASE_DB_PASSWORD"
          node --input-type=module <<'NODE'
          const raw = process.env.SUPABASE_DB_URL?.trim();
          const url = new URL(raw);
          const host = url.hostname.toLowerCase();
          if (!(host.endsWith('.pooler.supabase.com') && url.port === '5432')) {
            throw new Error('SUPABASE_DB_URL must use the Supabase shared Session pooler on port 5432.');
          }
          NODE

      - name: Verify E2E sources exist
        shell: bash
        run: |
          set -euo pipefail
          test -f e2e/pay-wallet-ownership-lifecycle.e2e.ts
          test -f functions/api/pay/v1/merchants/[merchantId]/wallet-challenges.ts
          test -f functions/api/pay/v1/merchants/[merchantId]/wallet-challenges/[challengeId].ts

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run authenticated Wallet Ownership lifecycle E2E
        id: e2e
        env:
          SOLMINT_PAY_PRODUCTION_ORIGIN: https://solmint.ir
          PAY_E2E_OTHER_MERCHANT_ID: ${{ secrets.PAY_E2E_OTHER_MERCHANT_ID }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set +e
          bunx tsx e2e/pay-wallet-ownership-lifecycle.e2e.ts 2>&1 | tee "$RUNNER_TEMP/wallet-ownership-e2e.log"
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Checkout main for checkpoint
        if: ${{ always() }}
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Record durable Wallet Ownership checkpoint
        if: ${{ always() }}
        env:
          EXIT_CODE: ${{ steps.e2e.outputs.exit_code || 'unknown' }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$EXIT_CODE" "$RUN_ID" "$RUN_URL" <<'PY'
          from pathlib import Path
          import sys

          exit_code, run_id, run_url = sys.argv[1:]
          path = Path("docs/solmint-pay-progress.md")
          text = path.read_text(encoding="utf-8")
          marker = "## 2026-09-18 — Wallet Ownership autonomous validation"
          if marker in text:
              prefix_text, remainder = text.split(marker, 1)
              suffix = ""
              if "\n## " in remainder:
                  _, suffix = remainder.split("\n## ", 1)
                  suffix = "\n## " + suffix
              text = prefix_text.rstrip() + "\n\n" + marker + suffix
          if exit_code == "0":
              status = "COMPLETED"
              body = (
                  "The authenticated Wallet Ownership lifecycle E2E completed successfully through the autonomous CI path.\n\n"
                  f"GitHub Actions run: `{run_id}`\n\nRun: {run_url}\n\n"
                  "The gate covered authentication, merchant ownership/IDOR isolation, trusted origin, wallet mismatch, tampered signature, server-side Ed25519 verification, replay rejection, concurrent atomic consumption, expiry, and error redaction.\n\n"
                  "Manual GitHub Workflow UI interaction is not a delivery prerequisite for this gate. The next required gate is the funded Devnet Payment Intent reconciliation lifecycle."
              )
          elif exit_code == "unknown":
              status = "BLOCKED / NO RESULT"
              body = f"The autonomous Wallet Ownership E2E produced no exit code.\n\nGitHub Actions run: `{run_id}`\n\nRun: {run_url}\n\nThe gate remains open."
          else:
              status = "BLOCKED / E2E FAILED"
              body = f"The authenticated Wallet Ownership lifecycle E2E executed but failed.\n\nGitHub Actions run: `{run_id}`\n\nE2E exit code: `{exit_code}`\n\nRun: {run_url}\n\nThe failure is authoritative for this attempt; no success is inferred. Fix the root cause and rerun through the autonomous path."
          entry = f"{marker}\n\nStatus: **{status}**\n\n{body}\n"
          if marker in text:
              prefix_text, remainder = text.split(marker, 1)
              suffix = ""
              if "\n## " in remainder:
                  _, suffix = remainder.split("\n## ", 1)
                  suffix = "\n## " + suffix
              text = prefix_text.rstrip() + "\n\n" + entry + suffix
          else:
              text = text.rstrip() + "\n\n" + entry
          path.write_text(text, encoding="utf-8")
          PY

      - name: Persist checkpoint
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/solmint-pay-progress.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(pay): record wallet ownership autonomous validation"
          git push origin HEAD:main

      - name: Close Wallet Ownership gate
        if: ${{ always() && steps.e2e.outputs.exit_code == '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue close 101 --repo "${{ github.repository }}" --reason completed

      - name: Keep Wallet Ownership gate open on failure
        if: ${{ always() && steps.e2e.outputs.exit_code != '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue comment 101 --repo "${{ github.repository }}" --body "Autonomous Wallet Ownership E2E did not pass. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Gate remains open."

      - name: Fail job when Wallet Ownership E2E fails
        if: ${{ always() && steps.e2e.outputs.exit_code != '0' }}
        shell: bash
        run: |
          echo "Wallet Ownership E2E failed or produced no successful result." >&2
          exit 1
