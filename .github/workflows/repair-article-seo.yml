name: Repair Article SEO Runtime

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply deterministic repair
        run: node scripts/repair-article-seo-runtime.mjs

      - name: Validate repaired source
        run: |
          grep -q "X-Solmint-SSR.*article-seo-v4" 'functions/article/[slug].ts'
          grep -q "solmint-article-bootstrap" 'functions/article/[slug].ts'
          grep -q "solmint-article-bootstrap" src/App.tsx
          grep -q "deleteArticleFromDisk(String(articleId))" server.ts
          git diff --check

      - name: Typecheck and tests
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm test

      - name: Persist repair and disable one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-article-seo.yml scripts/repair-article-seo-runtime.mjs
          git add 'functions/article/[slug].ts' src/App.tsx server.ts
          git commit -m "fix: make article SSR crawl-safe and stabilize hydration"
          git push
