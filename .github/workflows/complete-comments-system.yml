name: Complete production comments system

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate-comments:
    if: "!contains(github.event.head_commit.message, '[comments-integrated]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Integrate production comments
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          const serverPath = 'server.ts';
          let server = fs.readFileSync(serverPath, 'utf8');

          // Use the server-only Supabase service role for privileged comment mutations.
          server = server.replace(
            /const SUPABASE_ANON_KEY = process\.env\.VITE_SUPABASE_ANON_KEY \|\| process\.env\.SUPABASE_ANON_KEY \|\| \"sb_publishable_[^\"]+\";/,
            'const SUPABASE_ANON_KEY = process.env.VITE_SUPABASE_ANON_KEY || process.env.SUPABASE_ANON_KEY || "";\nconst SUPABASE_SERVICE_ROLE_KEY = process.env.SUPABASE_SERVICE_ROLE_KEY || "";'
          );
          server = server.replace(
            /serverSupabase = createClient\(SUPABASE_URL, SUPABASE_ANON_KEY\);/,
            'serverSupabase = createClient(SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY || SUPABASE_ANON_KEY);'
          );

          if (!server.includes('function createCommentAuthToken')) {
            const marker = 'function xmlEscape(str: string): string {';
            const helpers = `const COMMENT_AUTH_SECRET = process.env.COMMENT_AUTH_SECRET || process.env.ADMIN_PASSCODE || SUPABASE_URL;\n\nfunction createCommentAuthToken(userId: string): string {\n  const payload = userId + "." + Date.now();\n  const signature = crypto.createHmac("sha256", COMMENT_AUTH_SECRET).update(payload).digest("hex");\n  return Buffer.from(payload + "." + signature).toString("base64url");\n}\n\nfunction verifyCommentAuthToken(token: string, userId: string): boolean {\n  try {\n    const decoded = Buffer.from(String(token || ""), "base64url").toString("utf8");\n    const parts = decoded.split(".");\n    if (parts.length !== 3 || parts[0] !== userId) return false;\n    const issuedAt = Number(parts[1]);\n    if (!Number.isFinite(issuedAt) || Date.now() - issuedAt > 30 * 24 * 60 * 60 * 1000) return false;\n    const expected = crypto.createHmac("sha256", COMMENT_AUTH_SECRET).update(parts[0] + "." + parts[1]).digest("hex");\n    return crypto.timingSafeEqual(Buffer.from(parts[2]), Buffer.from(expected));\n  } catch { return false; }\n}\n\n`;
            server = server.replace(marker, helpers + marker);
          }

          // Never expose pending comments through the article aggregation path.
          server = server.replace('const allComments = getAllComments();', 'const allComments = getAllComments().filter((c: any) => c.approved === true);');

          // Add a signed comment session token to both admin and standard login responses.
          server = server.replace(
            'return res.json({ success: true, user: adminUser, isSuperAdmin: true });',
            'return res.json({ success: true, user: { ...adminUser, commentToken: createCommentAuthToken(adminUser.id) }, isSuperAdmin: true });'
          );
          server = server.replace(
            'return res.json({ success: true, user: found, isSuperAdmin: found.role === "superadmin" });',
            'return res.json({ success: true, user: { ...found, commentToken: createCommentAuthToken(found.id) }, isSuperAdmin: found.role === "superadmin" });'
          );

          const startMarker = '  // 3. REAL COMMENTS ENDPOINTS';
          const endMarker = '  // 4. REAL ARTICLES ENDPOINTS';
          const start = server.indexOf(startMarker);
          const end = server.indexOf(endMarker, start);
          if (start < 0 || end < 0) throw new Error('Could not locate comment API block');

          const newCommentsBlock = String.raw`  // 3. PRODUCTION COMMENTS ENDPOINTS
  const getCommentUser = (userId: string) => getAllUsers().find((u: any) => u.id === userId && u.isActive !== false);
  const requireCommentUser = (req: express.Request, res: express.Response): any | null => {
    const auth = String(req.headers.authorization || '');
    const token = auth.startsWith('Bearer ') ? auth.slice(7).trim() : '';
    const userId = String(req.body?.userId || req.query?.userId || '').trim();
    if (!userId || !token || !verifyCommentAuthToken(token, userId)) {
      res.status(401).json({ success: false, message: 'نشست کاربری معتبر نیست. لطفاً دوباره وارد حساب شوید.' });
      return null;
    }
    const user = getCommentUser(userId);
    if (!user) {
      res.status(401).json({ success: false, message: 'کاربر معتبر یا فعال نیست.' });
      return null;
    }
    return user;
  };

  app.get('/api/comments', async (req, res) => {
    try {
      const articleId = String(req.query.articleId || '').trim();
      if (!articleId) return res.status(400).json({ success: false, message: 'شناسه مقاله الزامی است.' });
      if (!serverSupabase) return res.json({ success: true, comments: getAllComments().filter((c: any) => c.articleId === articleId && c.approved === true) });
      const { data, error } = await serverSupabase.from('comments').select('*').eq('article_id', articleId).eq('approved', true).order('created_at', { ascending: true });
      if (error) throw error;
      return res.json({ success: true, comments: data || [] });
    } catch (err: any) {
      return res.status(500).json({ success: false, message: err.message });
    }
  });

  app.post('/api/comments/add', rateLimitMiddleware(5, 60_000), async (req, res) => {
    try {
      const user = requireCommentUser(req, res);
      if (!user) return;
      const articleId = String(req.body.articleId || '').trim();
      const text = String(req.body.text || '').trim();
      const parentId = req.body.parentId ? String(req.body.parentId).trim() : null;
      if (!articleId || text.length < 3 || text.length > 4000) return res.status(400).json({ success: false, message: 'متن دیدگاه باید بین ۳ تا ۴۰۰۰ کاراکتر باشد.' });
      const userName = String((user as any).fullName || (user as any).username || '').trim().slice(0, 80);
      if (!userName) return res.status(400).json({ success: false, message: 'نام کاربر معتبر نیست.' });

      if (parentId && serverSupabase) {
        const { data: parent } = await serverSupabase.from('comments').select('id,article_id,approved').eq('id', parentId).maybeSingle();
        if (!parent || parent.article_id !== articleId || parent.approved !== true) return res.status(400).json({ success: false, message: 'نظر والد معتبر نیست.' });
      }

      const newComment: any = {
        id: 'comment-' + crypto.randomUUID(),
        articleId,
        userName,
        userId: String((user as any).id),
        text,
        parentId,
        createdAt: new Date().toLocaleDateString('fa-IR'),
        approved: false,
        likeCount: 0,
        dislikeCount: 0
      };

      if (serverSupabase) {
        const { error } = await serverSupabase.from('comments').insert({ id: newComment.id, article_id: articleId, user_name: userName, user_id: newComment.userId, text, parent_id: parentId, approved: false, like_count: 0, dislike_count: 0 });
        if (error) return res.status(500).json({ success: false, message: 'ثبت دیدگاه در پایگاه داده انجام نشد.' });
      } else {
        saveComment(newComment);
      }

      return res.status(201).json({ success: true, comment: newComment, message: 'دیدگاه شما ثبت شد و پس از تأیید مدیر نمایش داده خواهد شد.' });
    } catch (err: any) {
      return res.status(500).json({ success: false, message: err.message });
    }
  });

  app.post('/api/comments/vote', rateLimitMiddleware(30, 60_000), async (req, res) => {
    try {
      const user = requireCommentUser(req, res);
      if (!user) return;
      const commentId = String(req.body.commentId || '').trim();
      const vote = Number(req.body.vote);
      if (!commentId || ![-1, 0, 1].includes(vote)) return res.status(400).json({ success: false, message: 'رأی نامعتبر است.' });
      if (!serverSupabase) return res.status(503).json({ success: false, message: 'سرویس رأی‌دهی در دسترس نیست.' });
      const { data, error } = await serverSupabase.rpc('set_comment_vote', { p_comment_id: commentId, p_user_id: String((user as any).id), p_vote: vote });
      if (error) throw error;
      const row = Array.isArray(data) ? data[0] : data;
      return res.json({ success: true, ...row });
    } catch (err: any) {
      return res.status(500).json({ success: false, message: err.message });
    }
  });

  app.post('/api/comments/approve', requireAdminAuth, async (req, res) => {
    try {
      const commentId = String(req.body.commentId || '').trim();
      const approved = Boolean(req.body.approved);
      if (!commentId) return res.status(400).json({ success: false, message: 'شناسه دیدگاه الزامی است.' });
      if (serverSupabase) {
        const { error } = await serverSupabase.from('comments').update({ approved }).eq('id', commentId);
        if (error) throw error;
      }
      const comments = getAllComments();
      const target = comments.find((c: any) => c.id === commentId);
      if (target) { target.approved = approved; saveComment(target); }
      return res.json({ success: true, message: approved ? 'دیدگاه تأیید شد.' : 'دیدگاه از انتشار خارج شد.' });
    } catch (err: any) {
      return res.status(500).json({ success: false, message: err.message });
    }
  });

  app.post('/api/comments/delete', requireAdminAuth, async (req, res) => {
    try {
      const commentId = String(req.body.commentId || '').trim();
      if (!commentId) return res.status(400).json({ success: false, message: 'شناسه دیدگاه الزامی است.' });
      if (serverSupabase) {
        const { error } = await serverSupabase.from('comments').delete().eq('id', commentId);
        if (error) throw error;
      }
      deleteComment(commentId);
      return res.json({ success: true, message: 'دیدگاه و پاسخ‌های آن حذف شد.' });
    } catch (err: any) {
      return res.status(500).json({ success: false, message: err.message });
    }
  });

`;
          server = server.slice(0, start) + newCommentsBlock + server.slice(end);
          fs.writeFileSync(serverPath, server);

          const component = String.raw`import React, { useMemo, useState } from 'react';
import { Heart, ThumbsDown, MessageCircle, Reply, Send, ChevronDown, ChevronUp } from 'lucide-react';

interface CommentItem { id: string; article_id?: string; articleId?: string; user_name?: string; userName?: string; user_id?: string; userId?: string; text: string; created_at?: string; createdAt?: string; approved?: boolean; parent_id?: string | null; parentId?: string | null; like_count?: number; likeCount?: number; dislike_count?: number; dislikeCount?: number; }
interface Props { articleId: string; comments: CommentItem[]; currentUser: any; openAuthModal: () => void; onCommentCreated: (comment: CommentItem) => void; }

const getToken = (user: any) => String(user?.commentToken || '');
const getUserId = (c: CommentItem) => c.user_id || c.userId || '';
const getParentId = (c: CommentItem) => c.parent_id ?? c.parentId ?? null;
const getName = (c: CommentItem) => c.user_name || c.userName || 'کاربر سولمینت';

export const CommentsSection: React.FC<Props> = ({ articleId, comments, currentUser, openAuthModal, onCommentCreated }) => {
  const [replyTo, setReplyTo] = useState<string | null>(null);
  const [draft, setDraft] = useState('');
  const [busy, setBusy] = useState<string | null>(null);
  const [expanded, setExpanded] = useState<Record<string, boolean>>({});
  const [voteState, setVoteState] = useState<Record<string, number>>({});
  const [voteCounts, setVoteCounts] = useState<Record<string, { like: number; dislike: number }>>({});

  const roots = useMemo(() => comments.filter(c => !getParentId(c)), [comments]);
  const children = useMemo(() => { const m: Record<string, CommentItem[]> = {}; comments.forEach(c => { const p = getParentId(c); if (p) (m[p] ||= []).push(c); }); return m; }, [comments]);
  const countFor = (c: CommentItem) => voteCounts[c.id] || { like: Number(c.like_count ?? c.likeCount ?? 0), dislike: Number(c.dislike_count ?? c.dislikeCount ?? 0) };

  const submit = async (parentId: string | null) => {
    if (!currentUser) { openAuthModal(); return; }
    const token = getToken(currentUser); if (!token) { alert('نشست شما منقضی شده است. لطفاً دوباره وارد شوید.'); openAuthModal(); return; }
    const text = draft.trim(); if (text.length < 3 || text.length > 4000) return;
    setBusy(parentId || 'root');
    try {
      const res = await fetch('/api/comments/add', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: JSON.stringify({ articleId, userId: currentUser.id, parentId, text }) });
      const data = await res.json().catch(() => null);
      if (!res.ok || !data?.success) throw new Error(data?.message || 'خطا در ثبت دیدگاه');
      setDraft(''); setReplyTo(null); onCommentCreated(data.comment); alert(data.message || 'دیدگاه ثبت شد.');
    } catch (e: any) { alert(e?.message || 'خطا در ثبت دیدگاه'); }
    finally { setBusy(null); }
  };

  const vote = async (comment: CommentItem, next: number) => {
    if (!currentUser) { openAuthModal(); return; }
    const token = getToken(currentUser); if (!token) { alert('لطفاً دوباره وارد حساب شوید.'); openAuthModal(); return; }
    setBusy('vote:' + comment.id);
    try {
      const res = await fetch('/api/comments/vote', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: JSON.stringify({ userId: currentUser.id, commentId: comment.id, vote: next }) });
      const data = await res.json().catch(() => null); if (!res.ok || !data?.success) throw new Error(data?.message || 'خطا در ثبت رأی');
      setVoteState(s => ({ ...s, [comment.id]: Number(data.user_vote || 0) }));
      setVoteCounts(s => ({ ...s, [comment.id]: { like: Number(data.like_count || 0), dislike: Number(data.dislike_count || 0) } }));
    } catch (e: any) { alert(e?.message || 'خطا در ثبت رأی'); }
    finally { setBusy(null); }
  };

  const render = (comment: CommentItem, depth = 0): React.ReactNode => {
    const kids = children[comment.id] || []; const counts = countFor(comment); const currentVote = voteState[comment.id] || 0; const canReply = depth < 3;
    return <div key={comment.id} className={depth ? 'mr-3 sm:mr-8 border-r border-slate-800 pr-3 sm:pr-5 space-y-3' : 'space-y-3'}>
      <div className='rounded-2xl bg-slate-900/70 border border-slate-800 p-3.5 sm:p-4'>
        <div className='flex items-start justify-between gap-3'><div className='min-w-0'><div className='font-bold text-sky-400 text-xs sm:text-sm truncate'>{getName(comment)}</div><div className='text-[10px] text-slate-500 mt-1'>{comment.created_at || comment.createdAt || 'اخیراً'}</div></div></div>
        <p className='text-sm text-slate-300 leading-7 break-words mt-3 whitespace-pre-wrap'>{comment.text}</p>
        <div className='flex flex-wrap items-center gap-2 mt-3'>
          <button disabled={busy === 'vote:' + comment.id} onClick={() => vote(comment, currentVote === 1 ? 0 : 1)} className={'inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border text-[11px] ' + (currentVote === 1 ? 'text-emerald-300 border-emerald-500/40 bg-emerald-500/10' : 'text-slate-400 border-slate-700 hover:text-emerald-300')}><Heart className='w-3.5 h-3.5' />{counts.like}</button>
          <button disabled={busy === 'vote:' + comment.id} onClick={() => vote(comment, currentVote === -1 ? 0 : -1)} className={'inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border text-[11px] ' + (currentVote === -1 ? 'text-rose-300 border-rose-500/40 bg-rose-500/10' : 'text-slate-400 border-slate-700 hover:text-rose-300')}><ThumbsDown className='w-3.5 h-3.5' />{counts.dislike}</button>
          {canReply && <button onClick={() => { setReplyTo(replyTo === comment.id ? null : comment.id); setExpanded(e => ({ ...e, [comment.id]: true })); }} className='inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border border-slate-700 text-slate-400 hover:text-sky-300 text-[11px]'><Reply className='w-3.5 h-3.5' />پاسخ</button>}
          {kids.length > 0 && <button onClick={() => setExpanded(e => ({ ...e, [comment.id]: !e[comment.id] }))} className='inline-flex items-center gap-1 px-2.5 py-1.5 text-[11px] text-slate-500 hover:text-white'>{expanded[comment.id] ? <ChevronUp className='w-3.5 h-3.5' /> : <ChevronDown className='w-3.5 h-3.5' />}{kids.length} پاسخ</button>}
        </div>
        {replyTo === comment.id && <div className='mt-3 flex gap-2'><textarea value={draft} onChange={e => setDraft(e.target.value)} rows={3} maxLength={4000} placeholder='پاسخ خود را بنویسید...' className='flex-1 min-w-0 bg-slate-800 border border-slate-700 rounded-xl p-3 text-xs text-slate-200 resize-y focus:outline-none focus:border-sky-500/50' /><button disabled={busy === comment.id} onClick={() => submit(comment.id)} className='self-end shrink-0 px-3 py-2.5 rounded-xl bg-sky-500 text-white text-xs font-bold'><Send className='w-4 h-4' /></button></div>}
      </div>
      {expanded[comment.id] && kids.length > 0 && <div className='space-y-3'>{kids.map(k => render(k, depth + 1))}</div>}
    </div>;
  };

  return <section className='pt-5 sm:pt-7 border-t border-slate-800 space-y-5 sm:space-y-6' aria-labelledby='article-comments-title'>
    <div className='flex items-center justify-between gap-3'><h3 id='article-comments-title' className='text-base sm:text-lg font-bold text-white flex items-center gap-2'><MessageCircle className='w-5 h-5 text-sky-400' />دیدگاه‌های کاربران ({comments.length})</h3><span className='text-[10px] text-slate-500'>نظرها پس از تأیید منتشر می‌شوند</span></div>
    {currentUser ? <div className='p-3.5 sm:p-4 rounded-2xl bg-slate-900 border border-slate-800 space-y-3'><div className='text-xs font-bold text-slate-300'>ثبت دیدگاه جدید</div><div className='flex gap-2'><textarea value={replyTo ? '' : draft} onChange={e => { if (!replyTo) setDraft(e.target.value); }} rows={4} maxLength={4000} placeholder='نظر تخصصی خود را بنویسید...' className='flex-1 min-w-0 bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-slate-200 resize-y focus:outline-none focus:border-sky-500/50' /><button disabled={busy === 'root'} onClick={() => submit(null)} className='self-end shrink-0 px-4 py-3 rounded-xl bg-sky-500 text-white text-xs font-bold'><Send className='w-4 h-4' /></button></div></div> : <button onClick={openAuthModal} className='w-full p-4 rounded-2xl bg-slate-900 border border-amber-500/30 text-amber-300 text-xs font-bold'>برای ثبت نظر، ورود یا ثبت‌نام کنید.</button>}
    <div className='space-y-3'>{roots.length ? roots.map(c => render(c)) : <div className='text-center py-8 text-slate-500 text-xs'>هنوز دیدگاه تأییدشده‌ای ثبت نشده است.</div>}</div>
  </section>;
};
`;
          fs.writeFileSync('src/components/CommentsSection.tsx', component);

          const blogPath = 'src/components/BlogHub.tsx';
          let blog = fs.readFileSync(blogPath, 'utf8');
          if (!blog.includes("./CommentsSection")) blog = blog.replace("import { AuthorAvatar } from './AuthorAvatar';", "import { AuthorAvatar } from './AuthorAvatar';\nimport { CommentsSection } from './CommentsSection';");
          const commentStart = blog.indexOf('        <div className="pt-5 sm:pt-7 border-t border-slate-800 space-y-5 sm:space-y-6">');
          const articleEnd = blog.indexOf('\n      </article>', commentStart);
          if (commentStart < 0 || articleEnd < 0) throw new Error('Could not locate BlogHub comment UI block');
          const replacement = '        <CommentsSection articleId={readingArticle.id} comments={(readingArticle.comments || []) as any} currentUser={currentUser as any} openAuthModal={() => { setReadingArticle(null); openAuthModal(); }} onCommentCreated={(comment) => { const updated = articles.map(a => a.id === readingArticle.id ? { ...a, comments: [comment as any, ...(a.comments || [])] } : a); setArticles(updated); setReadingArticle(prev => prev ? { ...prev, comments: [comment as any, ...(prev.comments || [])] } : null); }} />';
          blog = blog.slice(0, commentStart) + replacement + blog.slice(articleEnd);
          fs.writeFileSync(blogPath, blog);

          // Remove the temporary workflow from the same production commit.
          fs.unlinkSync('.github/workflows/complete-comments-system.yml');

          console.log('Production comments integration prepared.');
          NODE

      - name: Validate TypeScript build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/components/BlogHub.tsx src/components/CommentsSection.tsx .github/workflows/complete-comments-system.yml
          git diff --cached --check
          git commit -m "feat: complete production comments system [comments-integrated]"
          git push
