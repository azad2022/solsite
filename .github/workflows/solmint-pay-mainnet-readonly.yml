name: SolMint Pay Mainnet Read-only

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pay/**'
      - 'e2e/pay-mainnet-readonly.e2e.ts'
      - 'package.json'
      - '.github/workflows/solmint-pay-mainnet-readonly.yml'
  push:
    branches: [main]
    paths:
      - 'src/pay/**'
      - 'e2e/pay-mainnet-readonly.e2e.ts'
      - 'package.json'
      - '.github/workflows/solmint-pay-mainnet-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pay-mainnet-readonly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mainnet-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Require dedicated Mainnet RPC secret without displaying it
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: |
          if [ -z "$SOLANA_RPC_URL" ]; then
            echo "::error::Repository secret SOLANA_RPC_URL is required for read-only Mainnet E2E; no public RPC fallback is permitted."
            exit 1
          fi
          case "$SOLANA_RPC_URL" in
            https://*) ;;
            *) echo "::error::SOLANA_RPC_URL must use HTTPS."; exit 1 ;;
          esac

      - name: Run non-mutating Mainnet provider E2E
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: bunx tsx e2e/pay-mainnet-readonly.e2e.ts
