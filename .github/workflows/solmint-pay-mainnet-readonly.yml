name: SolMint Pay Mainnet Read-only

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pay/**'
      - 'e2e/pay-mainnet-readonly.e2e.ts'
      - 'package.json'
      - '.github/workflows/solmint-pay-mainnet-readonly.yml'
  push:
    branches: [main]
    paths:
      - 'src/pay/**'
      - 'e2e/pay-mainnet-readonly.e2e.ts'
      - 'package.json'
      - '.github/workflows/solmint-pay-mainnet-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLANA_RPC_URL: https://api.mainnet-beta.solana.com

concurrency:
  group: pay-mainnet-readonly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mainnet-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run non-mutating Mainnet provider E2E
        run: bun test e2e/pay-mainnet-readonly.e2e.ts
