name: DeepSeek Auto Publish

on:
  schedule:
    # Run frequently enough to tolerate GitHub Actions schedule delays.
    # The application itself decides whether a publish slot is due.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger production scheduler
        env:
          SITE_URL: https://solmint.ir
          CRON_SECRET: ${{ secrets.AUTOPUBLISH_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "AUTOPUBLISH_CRON_SECRET is not configured in GitHub repository secrets."
            exit 1
          fi

          response=$(curl --fail-with-body --silent --show-error \
            --max-time 90 \
            -X POST "${SITE_URL}/api/deepseek/auto-publish/scheduled" \
            -H "x-autopublish-cron-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json")

          echo "${response}"
