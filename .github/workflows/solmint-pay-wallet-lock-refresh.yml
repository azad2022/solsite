name: SolMint Pay temporary wallet dependency lock refresh

on:
  push:
    branches:
      - feat/pay-merchant-dedicated-solana-wallet
    paths:
      - package.json
      - bun.lock
      - .github/workflows/solmint-pay-wallet-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/pay-merchant-dedicated-solana-wallet
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Refresh frozen lockfile
        run: bun install

      - name: Commit lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: refresh bun lockfile for wallet generation"
          git push origin HEAD:feat/pay-merchant-dedicated-solana-wallet
