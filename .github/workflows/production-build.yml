name: Production Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply authentication hardening
        run: node scripts/harden-admin-frontend-auth.mjs
      - name: Repair production TypeScript mismatches
        run: node scripts/repair-production-types.mjs
      - name: Apply article UI and SSR hardening
        run: |
          node scripts/ensure-article-ui-mount.mjs
          node scripts/harden-article-ssr-content-v2.mjs
      - name: Verify hardened source
        run: |
          ! grep -R "hashPasscode\|DEFAULT_PASSCODE_HASH\|solmint_admin_passcode\|solmint_admin_pass_hash\|solmint_admin_session\|solmint_current_user" src/components/AdminCmsModal.tsx
      - name: Verify homepage SEO contract
        run: |
          node -e "const fs=require('fs'); const s=fs.readFileSync('index.html','utf8'); const h1=(s.match(/<h1\b/gi)||[]).length; if(h1!==1) throw new Error('Expected exactly one H1 in initial HTML, found '+h1); if(!s.includes('کیف پول غیرامانی سولانا')) throw new Error('Homepage H1 text missing'); if(!s.includes('<link rel=\"canonical\"')) throw new Error('Homepage canonical missing'); if(s.includes('solmint-hydration-guard')||s.includes('visibility: hidden')) throw new Error('Obsolete hydration guard detected');"
      - name: Verify article SEO and UI contract
        run: |
          grep -Fq 'solmint-article-bootstrap' 'functions/article/[slug].ts'
          grep -Fq 'setArticleBootstrap' 'functions/article/[slug].ts'
          grep -Fq 'function readArticleBootstrap(): Article[]' src/App.tsx
          grep -Fq 'function preloadInitialRoute()' src/main.tsx
          ! grep -Fq 'if (!key) return context.next()' 'functions/article/[slug].ts'
          ! grep -Fq 'if (!upstream.ok) return context.next()' 'functions/article/[slug].ts'
      - name: Apply HTML-aware contextual SSR linking
        run: node scripts/apply-html-aware-ssr-linking.mjs
      - name: Apply contextual internal article linking
        run: node scripts/apply-article-internal-linking.mjs
      - name: Verify contextual linker regression tests
        run: bun test tests/contextualHtmlLinking.test.ts
      - name: Production build
        run: bun run lint && node scripts/generate-sitemap.js && bunx vite build && bunx esbuild server.ts --bundle --platform=node --format=cjs --packages=external --sourcemap --outfile=dist/server.cjs
