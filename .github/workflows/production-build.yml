name: Production Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify production source invariants
        run: |
          ! grep -R "hashPasscode\|DEFAULT_PASSCODE_HASH\|solmint_admin_passcode\|solmint_admin_pass_hash\|solmint_admin_session\|solmint_current_user" src/components/AdminCmsModal.tsx
          grep -Fq 'solmint-article-bootstrap' 'functions/article/[slug].ts'
          grep -Fq 'setArticleBootstrap' 'functions/article/[slug].ts'
          grep -Fq 'function readArticleBootstrap(): Article[]' src/App.tsx
          grep -Fq 'function preloadInitialRoute()' src/main.tsx
          ! grep -Fq 'if (!key) return context.next()' 'functions/article/[slug].ts'
          ! grep -Fq 'if (!upstream.ok) return context.next()' 'functions/article/[slug].ts'

      - name: Verify homepage SEO contract
        run: |
          node -e "const fs=require('fs'); const s=fs.readFileSync('index.html','utf8'); const h1=(s.match(/<h1\b/gi)||[]).length; if(h1!==1) throw new Error('Expected exactly one H1 in initial HTML, found '+h1); if(!s.includes('کیف پول غیرامانی سولانا')) throw new Error('Homepage H1 text missing'); if(!s.includes('<link rel=\"canonical\"')) throw new Error('Homepage canonical missing'); if(s.includes('solmint-hydration-guard')||s.includes('visibility: hidden')) throw new Error('Obsolete hydration guard detected');"

      - name: Verify contextual linker regression tests
        run: bun test tests/contextualHtmlLinking.test.ts

      - name: Typecheck production source
        run: bunx tsc --noEmit -p tsconfig.ci.json

      - name: Production build
        run: bunx vite build && bunx esbuild server.ts --bundle --platform=node --format=cjs --packages=external --sourcemap --outfile=dist/server.cjs
