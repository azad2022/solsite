name: Production Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply authentication hardening
        run: node scripts/harden-admin-frontend-auth.mjs
      - name: Repair production TypeScript mismatches
        run: node scripts/repair-production-types.mjs
      - name: Apply article UI and SSR hardening
        run: |
          node scripts/ensure-article-ui-mount.mjs
          node scripts/harden-article-ssr-content-v2.mjs
          node scripts/apply-contextual-internal-linking.mjs
      - name: Verify hardened source
        run: |
          ! grep -R "hashPasscode\|DEFAULT_PASSCODE_HASH\|solmint_admin_passcode\|solmint_admin_pass_hash\|solmint_admin_session\|solmint_current_user" src/components/AdminCmsModal.tsx
      - name: Verify article SEO and UI contract
        run: |
          grep -Fq 'solmint-article-bootstrap' 'functions/article/[slug].ts'
          grep -Fq 'setArticleBootstrap' 'functions/article/[slug].ts'
          grep -Fq 'function readArticleBootstrap(): Article[]' src/App.tsx
          grep -Fq 'const bootstrap = readArticleBootstrap();' src/App.tsx
          grep -Fq 'function preloadInitialRoute()' src/main.tsx
          grep -Fq 'function revealAppAfterMount()' src/main.tsx
          grep -Fq 'solmint-hydrating' src/main.tsx
          grep -Fq 'solmint-hydration-guard' index.html
          grep -Fq 'visibility: hidden' index.html
          grep -Fq 'createRoot(document.getElementById('\''root'\'')!).render(' src/main.tsx
          grep -Fq 'contextualInternalHtmlLinking' 'functions/article/[slug].ts'
          grep -Fq 'linkContextualInternalHtmlReferences(originalContent, internalLinkTargets' 'functions/article/[slug].ts'
          grep -Fq 'const [related, internalLinkTargets] = await Promise.all' 'functions/article/[slug].ts'
          ! grep -Fq 'if (!key) return context.next()' 'functions/article/[slug].ts'
          ! grep -Fq 'if (!upstream.ok) return context.next()' 'functions/article/[slug].ts'
          grep -Fq '/article/*' 'public/_routes.json'
      - name: Persist generated source cleanup
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- src/components/AdminCmsModal.tsx src/components/CommentsModerationPanel.tsx src/components/landing/LandingPages.tsx src/utils/cmsApiClient.ts functions/api/wallet/analyze.ts functions/article/'[slug].ts' server.ts src/App.tsx src/main.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/AdminCmsModal.tsx src/components/CommentsModerationPanel.tsx src/components/landing/LandingPages.tsx src/utils/cmsApiClient.ts functions/api/wallet/analyze.ts functions/article/'[slug].ts' server.ts src/App.tsx src/main.tsx
            git commit -m "fix: persist article UI and SSR repairs"
            git push
          fi
      - name: Production build
        run: bun run lint && node scripts/generate-sitemap.js && bunx vite build && bunx esbuild server.ts --bundle --platform=node --format=cjs --packages=external --sourcemap --outfile=dist/server.cjs
