name: Production Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify production source invariants
        run: |
          ! grep -R "hashPasscode\|DEFAULT_PASSCODE_HASH\|solmint_admin_passcode\|solmint_admin_pass_hash\|solmint_admin_session\|solmint_current_user" src/components/AdminCmsModal.tsx
          grep -Fq 'solmint-article-bootstrap' 'functions/article/[slug].ts'
          grep -Fq 'setArticleBootstrap' 'functions/article/[slug].ts'
          grep -Fq 'function readArticleBootstrap(): Article[]' src/App.tsx
          grep -Fq 'function preloadInitialRoute()' src/main.tsx
          ! grep -Fq 'if (!key) return context.next()' 'functions/article/[slug].ts'
          ! grep -Fq 'if (!upstream.ok) return context.next()' 'functions/article/[slug].ts'

      - name: Verify homepage SEO contract
        run: |
          node -e "const fs=require('fs'); const s=fs.readFileSync('index.html','utf8'); const h1=(s.match(/<h1\b/gi)||[]).length; if(h1!==1) throw new Error('Expected exactly one H1 in initial HTML, found '+h1); if(!s.includes('کیف پول غیرامانی سولانا')) throw new Error('Homepage H1 text missing'); if(!s.includes('<link rel=\"canonical\"')) throw new Error('Homepage canonical missing'); if(s.includes('solmint-hydration-guard')||s.includes('visibility: hidden')) throw new Error('Obsolete hydration guard detected');"

      - name: Verify contextual linker regression tests
        run: bun test tests/contextualHtmlLinking.test.ts

      - name: Typecheck production source
        run: bunx tsc --noEmit -p tsconfig.ci.json

      - name: Production build
        run: bunx vite build && node scripts/ensure-pages-routes.mjs && bunx esbuild server.ts --bundle --platform=node --format=cjs --packages=external --sourcemap --outfile=dist/server.cjs

      - name: Verify Cloudflare Pages preview routes Referral Functions
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.GITHUB_TOKEN;
          const repository = process.env.GITHUB_REPOSITORY;
          const sha = process.env.TARGET_SHA;
          let previewUrl = '';
          for (let attempt = 1; attempt <= 120; attempt += 1) {
            const response = await fetch(
              'https://api.github.com/repos/' + repository + '/commits/' + sha + '/check-runs?per_page=100',
              { headers: { authorization: 'Bearer ' + token, accept: 'application/vnd.github+json' } },
            );
            if (!response.ok) throw new Error('GitHub check-runs lookup failed: ' + response.status);
            const data = await response.json();
            const check = (data.check_runs || []).find((item) => item.name === 'Cloudflare Pages');
            const summary = check?.output?.summary || '';
            const marker = 'https://';
            const start = summary.indexOf(marker);
            if (start >= 0) {
              const tail = summary.slice(start);
              const stopChars = ['\x27', '\x22', '<', ' ', '\\n', '\\r'];
              let end = tail.length;
              for (const char of stopChars) {
                const position = tail.indexOf(char);
                if (position >= 0 && position < end) end = position;
              }
              previewUrl = tail.slice(0, end).replace(/\/$/, '');
            }
            console.log('PAGES_PREVIEW_ROUTE_WAIT attempt=' + attempt + ' status=' + (check?.status || 'missing') + ' conclusion=' + (check?.conclusion || 'pending') + ' preview=' + (previewUrl || 'missing'));
            if (check?.status === 'completed' && check.conclusion === 'success' && previewUrl) break;
            if (check?.status === 'completed' && check.conclusion !== 'success') throw new Error('Cloudflare Pages preview deployment failed: ' + check.conclusion);
            if (attempt === 120) throw new Error('Timed out waiting for the Cloudflare Pages preview deployment.');
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          const response = await fetch(previewUrl + '/r/sm_000000000000', {
            redirect: 'manual',
            headers: { accept: 'text/plain' },
          });
          const body = (await response.text()).slice(0, 200);
          console.log('PAGES_PREVIEW_REFERRAL_ROUTE ' + JSON.stringify({ previewUrl, status: response.status, location: response.headers.get('location') || '', body }));
          if (response.status !== 404) throw new Error('Referral Function was not reached on the Cloudflare Pages preview. Expected 404 for an invalid short code, got HTTP ' + response.status);
          NODE
      - name: Assert source tree is unchanged
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
