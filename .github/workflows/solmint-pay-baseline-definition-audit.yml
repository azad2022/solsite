name: SolMint Pay — Baseline Definition Preservation Audit

on:
  workflow_dispatch:
  push:
    branches: ['audit/solmint-pay-next']
    paths:
      - '.github/workflows/solmint-pay-baseline-definition-audit.yml'
      - 'supabase/migrations/*_solmint_pay_*.sql'
      - 'supabase/migrations/20260829090000_solmint_production_baseline.sql'

permissions:
  contents: read
  actions: read

concurrency:
  group: solmint-pay-baseline-definition-audit
  cancel-in-progress: false

env:
  PAY_MIGRATION_COUNT: '52'
  PRODUCTION_SCHEMA_SHA256: '553d0f9a34f52ef344471c45398c41780438c0dbeec5c6cc63c912d6a8b223c5'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout audited commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove checkout matches event commit
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Validate pinned canonical Production baseline
        run: |
          set -Eeuo pipefail
          baseline='supabase/migrations/20260829090000_solmint_production_baseline.sql'
          test -s "$baseline"
          node scripts/solmint-pay/baseline-validate.mjs "$baseline"
          grep -F "Source snapshot SHA-256: $PRODUCTION_SCHEMA_SHA256" "$baseline" >/dev/null

      - name: Start PostgreSQL 17
        run: |
          set -Eeuo pipefail
          docker run -d --name solmint-pay-definition-postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=postgres -p 5432:5432 postgres:17-alpine
          for i in $(seq 1 60); do docker exec solmint-pay-definition-postgres pg_isready -U postgres -d postgres >/dev/null 2>&1 && break; sleep 2; done
          docker exec solmint-pay-definition-postgres pg_isready -U postgres -d postgres

      - name: Prepare fixture roles and schema
        run: |
          set -Eeuo pipefail
          docker exec solmint-pay-definition-postgres psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE SCHEMA IF NOT EXISTS extensions;"
          docker exec solmint-pay-definition-postgres psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon NOLOGIN; END IF; IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF; IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='service_role') THEN CREATE ROLE service_role NOLOGIN; END IF; END \$\$;"

      - name: Replay pinned Production baseline
        run: |
          set -Eeuo pipefail
          baseline='supabase/migrations/20260829090000_solmint_production_baseline.sql'
          sed -e '/^CREATE EXTENSION IF NOT EXISTS "pg_cron"/d' \
              -e '/^CREATE EXTENSION IF NOT EXISTS "pg_net"/d' \
              -e '/^CREATE EXTENSION IF NOT EXISTS "pg_stat_statements"/d' \
              -e '/^CREATE EXTENSION IF NOT EXISTS "supabase_vault"/d' \
              -e '/^COMMENT ON EXTENSION "pg_cron"/d' \
              -e '/^COMMENT ON EXTENSION "pg_net"/d' \
              -e '/^COMMENT ON EXTENSION "pg_stat_statements"/d' \
              -e '/^COMMENT ON EXTENSION "supabase_vault"/d' \
              -e '/^ALTER PUBLICATION "supabase_realtime" OWNER TO "postgres";/d' \
              "$baseline" > /tmp/production-schema.sql
          docker cp /tmp/production-schema.sql solmint-pay-definition-postgres:/tmp/production-schema.sql
          docker exec solmint-pay-definition-postgres psql -v ON_ERROR_STOP=1 -U postgres -d postgres -f /tmp/production-schema.sql > artifacts/solmint-pay-baseline-definition/production-replay.log 2>&1

      - name: Capture non-Pay definitions
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/solmint-pay-baseline-definition
          psql_exec() { docker exec solmint-pay-definition-postgres psql -U postgres -d postgres "$@"; }
          psql_exec -AtF '|' -c "select n.nspname,c.relname,c.relkind from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname not like 'pg_%' and n.nspname <> 'information_schema' and c.relkind in ('r','p','v','m','f','S') and c.relname not like 'pay_%' order by 1,2,3;" > artifacts/solmint-pay-baseline-definition/pre_relations.txt
          psql_exec -AtF '|' -c "select n.nspname,a.attrelid::regclass::text,a.attname,pg_catalog.format_type(a.atttypid,a.atttypmod),a.attnotnull,coalesce(pg_catalog.pg_get_expr(ad.adbin,ad.adrelid),'') from pg_attribute a join pg_class c on c.oid=a.attrelid join pg_namespace n on n.oid=c.relnamespace left join pg_attrdef ad on ad.adrelid=a.attrelid and ad.adnum=a.attnum where n.nspname not like 'pg_%' and n.nspname <> 'information_schema' and c.relname not like 'pay_%' and a.attnum > 0 and not a.attisdropped order by 1,2,3;" > artifacts/solmint-pay-baseline-definition/pre_columns.txt
          psql_exec -AtF '|' -c "select n.nspname,t.relname,c.conname,c.contype,pg_catalog.pg_get_constraintdef(c.oid,true) from pg_constraint c join pg_class t on t.oid=c.conrelid join pg_namespace n on n.oid=t.relnamespace where n.nspname not like 'pg_%' and n.nspname <> 'information_schema' and t.relname not like 'pay_%' order by 1,2,3;" > artifacts/solmint-pay-baseline-definition/pre_constraints.txt
          psql_exec -AtF '|' -c "select schemaname,tablename,indexname,indexdef from pg_indexes where schemaname not like 'pg_%' and schemaname <> 'information_schema' and tablename not like 'pay_%' and indexname not like 'pay_%' order by 1,2,3;" > artifacts/solmint-pay-baseline-definition/pre_indexes.txt
          psql_exec -AtF '|' -c "select n.nspname,p.proname,pg_get_function_identity_arguments(p.oid),p.prokind,p.prosecdef,coalesce(array_to_string(p.proconfig,','),'') from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname not like 'pg_%' and n.nspname <> 'information_schema' and p.proname not like 'pay_%' order by 1,2,3,4;" > artifacts/solmint-pay-baseline-definition/pre_functions.txt
          psql_exec -AtF '|' -c "select n.nspname,c.relname,t.tgname,pg_get_triggerdef(t.oid,true) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where not t.tgisinternal and n.nspname not like 'pg_%' and n.nspname <> 'information_schema' and c.relname not like 'pay_%' order by 1,2,3;" > artifacts/solmint-pay-baseline-definition/pre_triggers.txt
          psql_exec -AtF '|' -c "select schemaname,tablename,policyname,permissive,roles,cmd,coalesce(qual,''),coalesce(with_check,'') from pg_policies where schemaname not like 'pg_%' and schemaname <> 'information_schema' and tablename not like 'pay_%' order by 1,2,3;" > artifacts/solmint-pay-baseline-definition/pre_policies.txt
          psql_exec -AtF '|' -c "select table_schema,table_name,grantee,privilege_type,is_grantable from information_schema.role_table_grants where table_schema not like 'pg_%' and table_schema <> 'information_schema' and table_name not like 'pay_%' order by 1,2,3,4;" > artifacts/solmint-pay-baseline-definition/pre_table_grants.txt
          psql_exec -AtF '|' -c "select routine_schema,routine_name,grantee,privilege_type,is_grantable from information_schema.role_routine_grants where routine_schema not like 'pg_%' and routine_name not like 'pay_%' order by 1,2,3,4;" > artifacts/solmint-pay-baseline-definition/pre_routine_grants.txt

      - name: Replay complete Pay chain
        run: |
          set -Eeuo pipefail
          mapfile -t migrations < <(find supabase/migrations -maxdepth 1 -type f -name '*_solmint_pay_*.sql' -print | sort)
          test "${#migrations[@]}" -eq "$PAY_MIGRATION_COUNT"
          : > artifacts/solmint-pay-baseline-definition/pay-apply.log
          for migration in "${migrations[@]}"; do
            printf '\n===== APPLY %s =====\n' "$migration" | tee -a artifacts/solmint-pay-baseline-definition/pay-apply.log
            docker cp "$migration" solmint-pay-definition-postgres:/tmp/current-pay-migration.sql
            docker exec solmint-pay-definition-postgres psql -v ON_ERROR_STOP=1 -U postgres -d postgres -f /tmp/current-pay-migration.sql 2>&1 | tee -a artifacts/solmint-pay-baseline-definition/pay-apply.log
          done

      - name: Prove non-Pay definitions and security settings are unchanged
        run: |
          set -Eeuo pipefail
          psql_exec() { docker exec solmint-pay-definition-postgres psql -U postgres -d postgres "$@"; }
          psql_exec -AtF '|' -c "select n.nspname,c.relname,c.relkind from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname not like 'pg_%' and n.nspname <> 'information_schema' and c.relkind in ('r','p','v','m','f','S') and c.relname not like 'pay_%' order by 1,2,3;" > artifacts/solmint-pay-baseline-definition/post_relations.txt
          psql_exec -AtF '|' -c "select n.nspname,a.attrelid::regclass::text,a.attname,pg_catalog.format_type(a.atttypid,a.atttypmod),a.attnotnull,coalesce(pg_catalog.pg_get_expr(ad.adbin,ad.adrelid),'') from pg_attribute a join pg_class c on c.oid=a.attrelid join pg_namespace n on n.oid=c.relnamespace left join pg_attrdef ad on ad.adrelid=a.attrelid and ad.adnum=a.attnum where n.nspname not like 'pg_%' and n.nspname <> 'information_schema' and c.relname not like 'pay_%' and a.attnum > 0 and not a.attisdropped order by 1,2,3;" > artifacts/solmint-pay-baseline-definition/post_columns.txt
          psql_exec -AtF '|' -c "select n.nspname,t.relname,c.conname,c.contype,pg_catalog.pg_get_constraintdef(c.oid,true) from pg_constraint c join pg_class t on t.oid=c.conrelid join pg_namespace n on n.oid=t.relnamespace where n.nspname not like 'pg_%' and n.nspname <> 'information_schema' and t.relname not like 'pay_%' order by 1,2,3;" > artifacts/solmint-pay-baseline-definition/post_constraints.txt
          psql_exec -AtF '|' -c "select schemaname,tablename,indexname,indexdef from pg_indexes where schemaname not like 'pg_%' and schemaname <> 'information_schema' and tablename not like 'pay_%' and indexname not like 'pay_%' order by 1,2,3;" > artifacts/solmint-pay-baseline-definition/post_indexes.txt
          psql_exec -AtF '|' -c "select n.nspname,p.proname,pg_get_function_identity_arguments(p.oid),p.prokind,p.prosecdef,coalesce(array_to_string(p.proconfig,','),'') from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname not like 'pg_%' and n.nspname <> 'information_schema' and p.proname not like 'pay_%' order by 1,2,3,4;" > artifacts/solmint-pay-baseline-definition/post_functions.txt
          psql_exec -AtF '|' -c "select n.nspname,c.relname,t.tgname,pg_get_triggerdef(t.oid,true) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where not t.tgisinternal and n.nspname not like 'pg_%' and n.nspname <> 'information_schema' and c.relname not like 'pay_%' order by 1,2,3;" > artifacts/solmint-pay-baseline-definition/post_triggers.txt
          psql_exec -AtF '|' -c "select schemaname,tablename,policyname,permissive,roles,cmd,coalesce(qual,''),coalesce(with_check,'') from pg_policies where schemaname not like 'pg_%' and schemaname <> 'information_schema' and tablename not like 'pay_%' order by 1,2,3;" > artifacts/solmint-pay-baseline-definition/post_policies.txt
          psql_exec -AtF '|' -c "select table_schema,table_name,grantee,privilege_type,is_grantable from information_schema.role_table_grants where table_schema not like 'pg_%' and table_schema <> 'information_schema' and table_name not like 'pay_%' order by 1,2,3,4;" > artifacts/solmint-pay-baseline-definition/post_table_grants.txt
          psql_exec -AtF '|' -c "select routine_schema,routine_name,grantee,privilege_type,is_grantable from information_schema.role_routine_grants where routine_schema not like 'pg_%' and routine_name not like 'pay_%' order by 1,2,3,4;" > artifacts/solmint-pay-baseline-definition/post_routine_grants.txt
          for name in relations columns constraints indexes functions triggers policies table_grants routine_grants; do diff -u "artifacts/solmint-pay-baseline-definition/pre_${name}.txt" "artifacts/solmint-pay-baseline-definition/post_${name}.txt"; done

      - name: Verify active Pay migration count
        run: |
          set -Eeuo pipefail
          count="$(find supabase/migrations -maxdepth 1 -type f -name '*_solmint_pay_*.sql' | wc -l)"
          test "$count" -eq "$PAY_MIGRATION_COUNT"
          echo "Baseline definition preservation audit passed for $count Pay migrations."

      - name: Upload definition-audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solmint-pay-baseline-definition-audit-${{ github.run_id }}
          path: artifacts/solmint-pay-baseline-definition/
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup disposable database
        if: always()
        run: docker rm -f solmint-pay-definition-postgres >/dev/null 2>&1 || true
